<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTA // Mono Op-Art</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: 'Space Mono', monospace;
            cursor: crosshair;
        }
        #webgl-canvas {
            width: 100%; height: 100%; display: block;
        }
        #title {
            position: absolute; top: 16px; left: 20px;
            color: #fff; font-size: 11px; letter-spacing: 6px;
            text-transform: uppercase; user-select: none; pointer-events: none;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255,255,255,0.15);
        }
        #title span { font-weight: 400; opacity: 0.5; }
        #controls-hint {
            position: absolute; bottom: 16px; left: 20px;
            color: #888; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; user-select: none; pointer-events: none;
            line-height: 2;
        }
        #controls-hint kbd {
            display: inline-block;
            border: 1px solid #444; border-radius: 2px;
            padding: 1px 5px; font-family: inherit; font-size: 9px;
            color: #ccc; background: rgba(255,255,255,0.04);
        }
        #effect-name {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 14px; letter-spacing: 10px;
            text-transform: uppercase; user-select: none; pointer-events: none;
            opacity: 0; transition: opacity 0.3s ease;
            font-weight: 700; text-shadow: 0 0 30px rgba(255,255,255,0.3);
            white-space: nowrap;
        }
        #effect-name.show { opacity: 1; }

        /* lil-gui dark brutalist theme */
        .lil-gui {
            --background-color: rgba(5, 5, 5, 0.94);
            --title-background-color: #111;
            --title-text-color: #fff;
            --widget-color: #1a1a1a;
            --focus-color: #666;
            --number-color: #fff;
            --string-color: #fff;
            --font-family: 'Space Mono', monospace;
            --font-size: 10px;
            --input-background-color: #0a0a0a;
            --input-color: #fff;
            --border-color: #222;
            --title-background-focus-color: #222;
        }
    </style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<div id="title">VANTA <span>//</span> Mono Op-Art</div>
<div id="controls-hint">
    <kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom &nbsp; <kbd>1</kbd>–<kbd>8</kbd> effects<br>
    <kbd>space</kbd> auto-rotate &nbsp; <kbd>r</kbd> reset &nbsp; <kbd>h</kbd> hide ui
</div>
<div id="effect-name"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

<script>
// ================================================================
//  Fragment Shader — 8 raymarched SDF scenes, pure B&W op-art
// ================================================================
const fragmentShader = `
    precision highp float;

    uniform vec2  u_resolution;
    uniform float u_time;
    uniform vec3  u_eye;
    uniform vec3  u_forward;
    uniform vec3  u_right;
    uniform vec3  u_up;
    uniform vec3  u_mouse3;
    uniform int   u_mode;
    uniform float u_speed;
    uniform float u_scale;
    uniform float u_distortion;
    uniform float u_bands;
    uniform float u_mousePow;

    #define MAX_STEPS 80
    #define MAX_DIST  22.0
    #define PI 3.14159265

    // --- Math ----------------------------------------------------
    mat2 rot2(float a) { float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
    mat3 rotX(float a){ float c=cos(a),s=sin(a); return mat3(1,0,0,0,c,s,0,-s,c); }
    mat3 rotY(float a){ float c=cos(a),s=sin(a); return mat3(c,0,-s,0,1,0,s,0,c); }
    mat3 rotZ(float a){ float c=cos(a),s=sin(a); return mat3(c,s,0,-s,c,0,0,0,1); }

    float sdSphere(vec3 p, float r){ return length(p)-r; }
    float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
    float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
    float sdCylinder(vec3 p, float r){ return length(p.xz)-r; }
    float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

    float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
    float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

    // Value noise
    float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
    }

    // Lissajous curve helper
    vec3 curve(float s, float t, float u_scale){
        float a = u_scale * 3.0;
        float b = u_scale * 2.0;
        float c = u_scale * 1.5;
        return vec3(
            sin(a*s+t*0.5),
            sin(b*s+t*0.3),
            sin(c*s+t*0.7)
        );
    }

    // --- Scene ---------------------------------------------------
    float map(vec3 p){
        float t = u_time * u_speed;

        if(u_mode == 0){
            // Interference Sphere — two overlapping sphere grids
            float d = 1e9;
            for(int i = 0; i < 3; i++){
                float fi = float(i);
                vec3 c = vec3(
                    cos(t*0.3+fi*2.1)*1.5*u_scale,
                    sin(t*0.4+fi*1.7)*0.8,
                    sin(t*0.25+fi*2.5)*1.5*u_scale
                );
                d = smin(d, sdSphere(p-c, 0.35), u_distortion*0.8);
            }
            // mouse attractor
            float md = length(p - u_mouse3);
            d = smin(d, sdSphere(p-u_mouse3, 0.25+sin(t*2.0)*0.1), 0.6*u_mousePow);
            return d;
        }

        if(u_mode == 1){
            // Folded Terrain — heightfield with fold
            float h = sin(p.x*1.2*u_scale+t)*0.4;
            h += cos(p.z*0.9*u_scale-t*0.6)*0.3;
            h += vnoise(vec2(p.x,p.z)*u_scale*0.5+t*0.2)*0.35*u_distortion;
            // fold the terrain back on itself
            float fold = abs(p.x + sin(t*0.3)*0.5);
            h *= smoothstep(0.0, 1.5, fold);
            // mouse ripple
            float md = length(p.xz - u_mouse3.xz);
            h += sin(md*4.0-t*5.0)*exp(-md*2.0)*u_mousePow*0.5;
            return p.y - h;
        }

        if(u_mode == 2){
            // Nested Cubes — rotating nested wireframe-ish boxes
            float d = 1e9;
            for(int i = 0; i < 4; i++){
                float fi = float(i);
                vec3 q = rotY(t*0.3*(1.0+fi*0.3)) * rotX(t*0.2*(1.0+fi*0.2)) * p;
                float s = 0.3 + fi*0.35*u_scale;
                float box = sdBox(q, vec3(s, s, s));
                // shell only (hollow box)
                float inner = sdBox(q, vec3(s-0.06, s-0.06, s-0.06));
                d = min(d, max(box, -inner));
            }
            return d;
        }

        if(u_mode == 3){
            // Spiral Helix — DNA double helix with connecting rungs
            float a = p.y * 1.8 * u_scale + t;
            float r = 0.8;
            vec2 c1 = r * vec2(cos(a), sin(a));
            vec2 c2 = r * vec2(cos(a+PI), sin(a+PI));
            vec2 pp = p.xz;
            float d1 = length(pp - c1) - 0.08;
            float d2 = length(pp - c2) - 0.08;
            float helix = min(d1, d2);
            // rungs every so often
            float rungPhase = mod(a, PI*2.0);
            float rung = 1.0;
            if(rungPhase < 0.3 || rungPhase > PI*2.0-0.3){
                float t_param = (rungPhase < 0.3) ? rungPhase/0.3 : (PI*2.0-rungPhase)/0.3;
                vec2 mid = mix(c1, c2, t_param);
                rung = length(pp - mid) - 0.04;
            }
            float d = min(helix, rung);
            // mouse influence
            d += sin(length(p-u_mouse3)*5.0-t*3.0)*exp(-length(p-u_mouse3)*1.5)*u_mousePow*0.15;
            return d;
        }

        if(u_mode == 4){
            // Crystal Formation — sharp angular shards
            float d = 1e9;
            for(int i = 0; i < 6; i++){
                float fi = float(i);
                vec3 c = vec3(
                    sin(fi*1.7+t*0.2)*1.2*u_scale,
                    fi*0.35 - 0.9,
                    cos(fi*2.3+t*0.15)*1.2*u_scale
                );
                // elongated box as crystal shard
                vec3 q = rotY(fi*0.8+t*0.1) * rotX(fi*1.2) * (p - c);
                float shard = sdBox(q, vec3(0.06, 0.4+fi*0.1, 0.06));
                d = min(d, shard);
            }
            // ground
            d = min(d, p.y + 0.5);
            // mouse crystal
            float md = length(p - u_mouse3);
            d = min(d, sdSphere(p-u_mouse3, 0.15)*0.5 + sin(md*8.0-t*4.0)*0.05*u_mousePow);
            return d;
        }

        if(u_mode == 5){
            // Vortex Rings — concentric tori spinning outward
            float d = 1e9;
            for(int i = 0; i < 5; i++){
                float fi = float(i);
                float angle = fi * 0.7 + t * 0.4 * (1.0 + fi*0.15);
                vec3 q = rotY(angle) * rotX(angle*0.6) * p;
                float R = 0.5 + fi * 0.22 * u_scale;
                float tube = 0.04 + sin(t+fi)*0.015;
                d = min(d, sdTorus(q, vec2(R, tube)));
            }
            return d;
        }

        if(u_mode == 6){
            // Grid Maze — animated labyrinthine walls
            float cell = 1.0 / u_scale;
            vec2 id = floor(p.xz / cell);
            vec2 g = fract(p.xz / cell) - 0.5;

            float h = 0.5 + 0.3 * sin(t*0.5 + hash21(id)*6.28);
            float wall = 1e9;

            // horizontal wall
            float hw = step(0.5, hash21(id + 100.0));
            wall = min(wall, sdBox(vec3(g.x*cell, p.y-h*0.5, g.y*cell-0.5*cell*hw), vec3(0.45*cell, h*0.5, 0.03*cell)));

            // vertical wall
            float vw = step(0.5, hash21(id + 200.0));
            wall = min(wall, sdBox(vec3(g.x*cell-0.5*cell*vw, p.y-h*0.5, g.y*cell), vec3(0.03*cell, h*0.5, 0.45*cell)));

            return min(wall, p.y); // ground
        }

        // Lissajous Knot — parametric curve rendered as tube
        // approximate tube distance
        float minD = 1e9;
        for(int i = 0; i < 30; i++){
            float fi = float(i);
            float s = fi / 30.0 * PI * 2.0;
            vec3 q = p - curve(s, t, u_scale);
            minD = min(minD, length(q));
        }
        // mouse attractor
        float md = length(p - u_mouse3);
        minD += sin(md*6.0-t*4.0)*exp(-md*1.8)*u_mousePow*0.1;
        return minD - 0.08 * u_distortion;
    }

    // --- Raymarching ---------------------------------------------
    float march(vec3 ro, vec3 rd){
        float t = 0.0;
        for(int i = 0; i < MAX_STEPS; i++){
            if(t > MAX_DIST) return -1.0;
            float d = map(ro + rd*t);
            if(d < 0.0004 + t*0.001) return t;
            t += d;
        }
        return -1.0;
    }

    vec3 calcNormal(vec3 p){
        vec2 e = vec2(1.0, -1.0) * 0.0015;
        return normalize(
            e.xyy * map(p + e.xyy) +
            e.yyx * map(p + e.yyx) +
            e.yxy * map(p + e.yxy) +
            e.xxx * map(p + e.xxx)
        );
    }

    // --- Main ----------------------------------------------------
    void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec3 rd = normalize(u_forward + uv.x*u_right*0.9 + uv.y*u_up*0.9);

        float col = 0.0;
        float t = march(u_eye, rd);

        if(t > 0.0){
            vec3 p = u_eye + rd*t;
            vec3 n = calcNormal(p);

            vec3 lig = normalize(vec3(0.6, 0.85, 0.4));
            float dif = clamp(dot(n, lig), 0.0, 1.0);
            float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0) * 0.6;
            float ao = 0.5 + 0.5 * n.y;
            float shade = 0.1 + dif*0.9 + rim + ao*0.15;

            // contour banding
            float stripes = mod(shade * u_bands, 2.0);
            float af = fwidth(shade) * u_bands * 1.5 + 0.004;
            col = smoothstep(1.0-af, 1.0+af, stripes);
        }

        gl_FragColor = vec4(vec3(col), 1.0);
    }
`;

const vertexShader = `
    void main(){
        gl_Position = vec4(position, 1.0);
    }
`;

// ================================================================
//  Three.js setup
// ================================================================
const canvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
    u_resolution: { value: new THREE.Vector2() },
    u_time:       { value: 0 },
    u_eye:        { value: new THREE.Vector3() },
    u_forward:    { value: new THREE.Vector3(0, 0, -1) },
    u_right:      { value: new THREE.Vector3(1, 0, 0) },
    u_up:         { value: new THREE.Vector3(0, 1, 0) },
    u_mouse3:     { value: new THREE.Vector3() },
    u_mode:       { value: 0 },
    u_speed:      { value: 1.0 },
    u_scale:      { value: 1.0 },
    u_distortion: { value: 1.0 },
    u_bands:      { value: 4.0 },
    u_mousePow:   { value: 1.0 }
};

const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

// ================================================================
//  Camera orbit
// ================================================================
const cam = { yaw: 0.5, pitch: 0.4, dist: 4.5, target: new THREE.Vector3(0, 0, 0) };
let dragging = false;
let lastX = 0, lastY = 0;

const CAM_PRESETS = [
    { yaw: 0.5,  pitch: 0.4,  dist: 4.5 },  // Interference Sphere
    { yaw: 0.6,  pitch: 0.55, dist: 5.5 },  // Folded Terrain
    { yaw: 0.55, pitch: 0.35, dist: 4.0 },  // Nested Cubes
    { yaw: 0.45, pitch: 0.15, dist: 5.0 },  // Spiral Helix
    { yaw: 0.5,  pitch: 0.5,  dist: 5.2 },  // Crystal Formation
    { yaw: 0.6,  pitch: 0.3,  dist: 4.8 },  // Vortex Rings
    { yaw: 0.55, pitch: 0.55, dist: 6.0 },  // Grid Maze
    { yaw: 0.5,  pitch: 0.3,  dist: 4.2 },  // Lissajous Knot
];

const EFFECTS = [
    'Interference Sphere',
    'Folded Terrain',
    'Nested Cubes',
    'Spiral Helix',
    'Crystal Formation',
    'Vortex Rings',
    'Grid Maze',
    'Lissajous Knot'
];

// ================================================================
//  Interaction
// ================================================================
const targetMouse = new THREE.Vector2(0, 0);
const currentMouse = new THREE.Vector2(0, 0);

function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    uniforms.u_resolution.value.set(w, h);
}
window.addEventListener('resize', onResize);
onResize();

canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
    targetMouse.set(
        (e.clientX / window.innerWidth)*2 - 1,
        -(e.clientY / window.innerHeight)*2 + 1
    );
    if(dragging){
        cam.yaw -= (e.clientX - lastX) * 0.005;
        cam.pitch = THREE.MathUtils.clamp(cam.pitch - (e.clientY - lastY)*0.005, -1.15, 1.15);
        lastX = e.clientX; lastY = e.clientY;
    }
});

canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = THREE.MathUtils.clamp(cam.dist * (1 + e.deltaY*0.001), 2.0, 9.0);
}, { passive: false });

// ================================================================
//  Effect name toast
// ================================================================
const effectNameEl = document.getElementById('effect-name');
let toastTimeout = null;

function showToast(name){
    effectNameEl.textContent = name;
    effectNameEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => effectNameEl.classList.remove('show'), 1200);
}

// ================================================================
//  GUI
// ================================================================
const gui = new lil.GUI({ title: 'Parameters' });
let guiVisible = true;

const params = {
    Effect: 'Interference Sphere',
    Speed: 1.0,
    Scale: 1.0,
    Distortion: 1.0,
    Bands: 4,
    'Mouse Force': 1.0,
    'Auto Rotate': true,
    Reset: () => {
        params.Speed = 1.0;
        params.Scale = 1.0;
        params.Distortion = 1.0;
        params.Bands = 4;
        params['Mouse Force'] = 1.0;
        params['Auto Rotate'] = true;
        uniforms.u_speed.value = 1.0;
        uniforms.u_scale.value = 1.0;
        uniforms.u_distortion.value = 1.0;
        uniforms.u_bands.value = 4.0;
        uniforms.u_mousePow.value = 1.0;
        gui.controllersRecursive().forEach(c => c.updateDisplay());
    }
};

function setEffect(name){
    params.Effect = name;
    uniforms.u_mode.value = EFFECTS.indexOf(name);
    const preset = CAM_PRESETS[EFFECTS.indexOf(name)];
    if(preset){ cam.yaw=preset.yaw; cam.pitch=preset.pitch; cam.dist=preset.dist; }
    effectCtrl.updateDisplay();
    showToast(name);
}

const effectCtrl = gui.add(params, 'Effect', EFFECTS).onChange(setEffect);
gui.add(params, 'Speed', 0.0, 3.0, 0.01).onChange(v => uniforms.u_speed.value = v);
gui.add(params, 'Scale', 0.2, 3.0, 0.01).onChange(v => uniforms.u_scale.value = v);
gui.add(params, 'Distortion', 0.0, 3.0, 0.01).onChange(v => uniforms.u_distortion.value = v);
gui.add(params, 'Bands', 2, 12, 1).onChange(v => uniforms.u_bands.value = v);
gui.add(params, 'Mouse Force', 0.0, 2.0, 0.01).onChange(v => uniforms.u_mousePow.value = v);
gui.add(params, 'Auto Rotate');
gui.add(params, 'Reset');

// ================================================================
//  Keyboard shortcuts
// ================================================================
window.addEventListener('keydown', e => {
    const idx = '12345678'.indexOf(e.key);
    if(idx !== -1) setEffect(EFFECTS[idx]);
    else if(e.key === 'r' || e.key === 'R') params.Reset();
    else if(e.key === ' '){ e.preventDefault(); params['Auto Rotate'] = !params['Auto Rotate']; gui.controllersRecursive().forEach(c => c.updateDisplay()); }
    else if(e.key === 'h' || e.key === 'H'){ guiVisible = !guiVisible; gui.domElement.style.display = guiVisible ? '' : 'none'; }
});

// ================================================================
//  Render loop
// ================================================================
const clock = new THREE.Clock();
const worldUp = new THREE.Vector3(0, 1, 0);
const vFwd = new THREE.Vector3();
const vRight = new THREE.Vector3();
const vUp = new THREE.Vector3();

function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    uniforms.u_time.value += dt;

    if(params['Auto Rotate'] && !dragging) cam.yaw += dt * 0.12;

    uniforms.u_eye.value.set(
        cam.target.x + cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw),
        cam.target.y + cam.dist*Math.sin(cam.pitch),
        cam.target.z + cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw)
    );
    vFwd.copy(cam.target).sub(uniforms.u_eye.value).normalize();
    vRight.crossVectors(vFwd, worldUp).normalize();
    vUp.crossVectors(vRight, vFwd).normalize();
    uniforms.u_forward.value.copy(vFwd);
    uniforms.u_right.value.copy(vRight);
    uniforms.u_up.value.copy(vUp);

    currentMouse.lerp(targetMouse, 0.07);
    uniforms.u_mouse3.value
        .copy(uniforms.u_eye.value)
        .addScaledVector(vFwd, 2.5)
        .addScaledVector(vRight, currentMouse.x*2.0)
        .addScaledVector(vUp, currentMouse.y*2.0);

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
