<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALIEN INVASION — CITY DESTROYER</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />

<style>
  /* ============================ BASE ============================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05060e;
    font-family: 'Orbitron', monospace;
  }
  canvas { display: block; }

  /* ============================ HUD ============================ */
  #hud {
    position: fixed; top: 26px; left: 30px; z-index: 10;
    pointer-events: none; user-select: none;
    text-shadow: 0 0 18px rgba(0, 229, 255, .55), 0 0 42px rgba(122, 60, 255, .35);
  }
  #hud .title {
    font-size: 27px; font-weight: 900; letter-spacing: 7px;
    background: linear-gradient(90deg, #9adfff, #d9c4ff 55%, #ff8ab0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 16px rgba(122, 60, 255, .85));
  }
  #hud .subtitle {
    font-size: 10px; font-weight: 700; letter-spacing: 10px;
    color: #ff6a8a; margin-top: 5px;
    text-shadow: 0 0 12px rgba(255, 59, 110, .85);
  }
  #cityLabel {
    margin-top: 26px; font-size: 16px; font-weight: 700; letter-spacing: 6px;
    color: #9adfff; text-shadow: 0 0 18px rgba(0, 229, 255, .7);
  }
  #integrity { margin-top: 9px; font-size: 11px; letter-spacing: 3px; color: #7f8db0; }
  #integrityVal { color: #6bff9e; text-shadow: 0 0 10px rgba(107, 255, 158, .75); }

  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 9px; letter-spacing: 4px;
    color: rgba(165, 185, 225, .55); pointer-events: none; user-select: none;
    white-space: nowrap;
  }

  #victory {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20; pointer-events: none; user-select: none;
    font-size: 42px; font-weight: 900; letter-spacing: 12px; white-space: nowrap;
    color: #ff5d7a; opacity: 0;
    text-shadow: 0 0 22px rgba(255, 59, 110, .95), 0 0 70px rgba(255, 59, 110, .45);
  }

  /* ==================== SCREEN FX OVERLAYS ==================== */
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 3, 10, .6) 100%);
  }
  #scanlines {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  /* ====================== lil-gui THEME ======================= */
  .lil-gui {
    --background-color: rgba(8, 10, 24, .82);
    --title-background-color: rgba(122, 60, 255, .30);
    --widget-color: rgba(30, 40, 85, .55);
    --focus-color: #00e5ff;
    --number-color: #9adfff;
    --string-color: #c9a4ff;
    --input-background-color: #0c1024;
    --input-number-color: #9adfff;
    --input-string-color: #c9a4ff;
    --slider-knob-color: #00e5ff;
    --slider-input-background-color: #0c1024;
    --slider-input-focus-color: #00e5ff;
    --name-width: 62%;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
  }
  .lil-gui .title { letter-spacing: 2px; }
  .lil-gui .controller.danger button {
    color: #ff5d7a;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 59, 110, .8);
  }
</style>
</head>
<body>

  <!-- ========================= HUD ========================= -->
  <div id="hud">
    <div class="title">ALIEN INVASION</div>
    <div class="subtitle">CITY DESTROYER</div>
    <div id="cityLabel">NEW YORK</div>
    <div id="integrity">STRUCTURAL INTEGRITY: <span id="integrityVal">100%</span></div>
  </div>
  <div id="hint">DRAG — ORBIT &nbsp;·&nbsp; SCROLL — ZOOM &nbsp;·&nbsp; CLICK A BUILDING — FIRE</div>
  <div id="victory">THE ALIENS WON</div>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <!-- GSAP (classic global build, used by the module below) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- three.js + addons via import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  // ============================================================================
  //  ALIEN INVASION — CITY DESTROYER
  //  A single-file WebGL demo: procedural cyberpunk cities, a glowing alien
  //  mothership and a clickable destruction pipeline (lasers, impact rings,
  //  particle fire/smoke, crumbling buildings).
  // ============================================================================

  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js';

  const gsap = window.gsap;

  // Deterministic timing: without lag smoothing, slow frames stretch tweens
  // instead of jumping/crawling — attacks always land on wall-clock time.
  gsap.ticker.lagSmoothing(0);

  // Disable color management so every color (fog, materials, shader uniforms)
  // travels through the pipeline untouched — deterministic neon styling.
  THREE.ColorManagement.enabled = false;

  // ============================================================================
  //  CONFIGURATION
  // ============================================================================

  const CONFIG = {
    fogColor: 0x0a0a18,
    fogDensity: 0.0046,
    shipHeight: 112,
    beamColor: 0xff3b6e,
    maxBeams: 12,
    maxRings: 12,
    maxFlashes: 12,
    maxLights: 10,
    maxDots: 8,
    fireMax: 900,
    smokeMax: 600,
  };

  // ============================================================================
  //  UTILITIES
  // ============================================================================

  /** Deterministic PRNG so every city layout is reproducible. */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return h >>> 0;
  }

  function randRange(rng, min, max) { return min + rng() * (max - min); }

  /** Normalize a yaw angle to the shortest-path equivalent of `target`. */
  function normalizeAngle(target, current) {
    while (target - current > Math.PI) target -= Math.PI * 2;
    while (target - current < -Math.PI) target += Math.PI * 2;
    return target;
  }

  /** Create a soft radial-gradient sprite texture from raw color stops. */
  function makeGlowTexture(stops, size = 128) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [offset, color] of stops) g.addColorStop(offset, color);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
  }

  /** Soft circular particle sprite. */
  function makeSoftDotTexture(size = 64) {
    return makeGlowTexture([
      [0.0, 'rgba(255,255,255,1)'],
      [0.35, 'rgba(255,255,255,0.8)'],
      [1.0, 'rgba(255,255,255,0)'],
    ], size);
  }

  /** Night-sky dome texture: deep space with a neon horizon glow. */
  function makeSkyTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.0, '#04050c');
    g.addColorStop(0.45, '#0a0c1f');
    g.addColorStop(0.62, '#141538');
    g.addColorStop(0.72, '#2b1b5e');
    g.addColorStop(0.82, '#3d1f52');
    g.addColorStop(0.9, '#12204a');
    g.addColorStop(1.0, '#070a1c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 512);
    // faint nebula smudges
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const x = Math.random() * 1024, y = Math.random() * 340;
      const r = 40 + Math.random() * 160;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      const hue = Math.random();
      const col = hue > 0.66 ? 'rgba(122,60,255,' : hue > 0.33 ? 'rgba(0,160,255,' : 'rgba(255,80,160,';
      rg.addColorStop(0, col + (0.05 + Math.random() * 0.06) + ')');
      rg.addColorStop(1, col + '0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
  }

  /** Ground grid texture: dark tarmac with a faint neon grid. */
  function makeGridTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 2048;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#060710';
    ctx.fillRect(0, 0, 2048, 2048);
    // radial falloff to transparent so the plane fades into the fog
    const fog = ctx.createRadialGradient(1024, 1024, 300, 1024, 1024, 1024);
    fog.addColorStop(0, 'rgba(6,7,16,1)');
    fog.addColorStop(0.85, 'rgba(6,7,16,0.96)');
    fog.addColorStop(1, 'rgba(6,7,16,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, 2048, 2048);
    // grid lines
    ctx.strokeStyle = 'rgba(0,190,255,0.055)';
    ctx.lineWidth = 1;
    const step = 128;
    for (let i = 0; i <= 2048; i += step) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 2048); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(2048, i); ctx.stroke();
    }
    // concentric glow rings around the city
    ctx.strokeStyle = 'rgba(0,229,255,0.09)';
    for (const r of [260, 420, 640]) {
      ctx.beginPath(); ctx.arc(1024, 1024, r, 0, Math.PI * 2); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
  }

  /** Building facade: dark base with a grid of lit windows (used by landmarks). */
  function makeFacadeTexture(windowColor, seed) {
    const rng = mulberry32(seed);
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0b0e16';
    ctx.fillRect(0, 0, 256, 256);
    const cols = 8, rows = 8;
    const cw = 256 / cols, ch = 256 / rows;
    for (let ry = 0; ry < rows; ry++) {
      for (let rx = 0; rx < cols; rx++) {
        const lit = rng() > 0.42;
        const shade = 0.5 + rng() * 0.5;
        ctx.fillStyle = lit
          ? `rgba(${(windowColor.r * 255 * shade) | 0},${(windowColor.g * 255 * shade) | 0},${(windowColor.b * 255 * shade) | 0},1)`
          : 'rgba(20,24,40,0.9)';
        ctx.fillRect(rx * cw + 9, ry * ch + 9, cw - 18, ch - 18);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.NoColorSpace;
    return tex;
  }

  // ============================================================================
  //  RENDERER / SCENE / CAMERA / CONTROLS
  // ============================================================================

  // ?preserve=1 keeps the drawing buffer (used by headless pixel tests)
  const preserve = new URLSearchParams(location.search).get('preserve') === '1';
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: preserve });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.fogColor);
  scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 4000);
  camera.position.set(150, 100, 175);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 22, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 30;
  controls.maxDistance = 420;
  controls.maxPolarAngle = 1.62; // allow a glimpse under the horizon
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  // Everything physical (city, ship, FX) lives in this group so we can do a
  // cheap camera "shake" without fighting OrbitControls.
  const sceneGroup = new THREE.Group();
  scene.add(sceneGroup);

  // ============================================================================
  //  LIGHTING
  // ============================================================================

  scene.add(new THREE.HemisphereLight(0x3a4cff, 0x0d0d1a, 0.55));
  const moonLight = new THREE.DirectionalLight(0x88aaff, 0.7);
  moonLight.position.set(300, 600, -200);
  scene.add(moonLight);

  // ============================================================================
  //  SKY — dome, stars, moon glow
  // ============================================================================

  const skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(1600, 32, 16),
    new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
  );
  scene.add(skyDome);

  const starGeo = new THREE.BufferGeometry();
  const STAR_COUNT = 900;
  const starPos = new Float32Array(STAR_COUNT * 3);
  const starPhase = new Float32Array(STAR_COUNT);
  const starSize = new Float32Array(STAR_COUNT);
  const rngStars = mulberry32(1337);
  for (let i = 0; i < STAR_COUNT; i++) {
    // random point on a dome, mostly above the horizon
    const theta = rngStars() * Math.PI * 2;
    const phi = Math.acos(1 - rngStars() * 1.12); // 0..~1.5rad -> tilt upward
    const r = 1450;
    starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 60;
    starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    starPhase[i] = rngStars();
    // world units, drawn at projection-accurate px size (tuned for r=1450)
    starSize[i] = 2.2 + rngStars() * 4.6;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));

  const starMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uHeight: { value: window.innerHeight },
    },
    vertexShader: `
      attribute float aPhase;
      attribute float aSize;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uHeight;
      varying float vA;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vA = 0.45 + 0.55 * (0.5 + 0.5 * sin(uTime * (0.7 + aPhase * 1.3) + aPhase * 6.2831));
        gl_PointSize = aSize * uPixelRatio * uHeight * 0.5 * projectionMatrix[1][1] / -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float m = smoothstep(0.5, 0.04, d);
        gl_FragColor = vec4(vec3(0.82, 0.9, 1.0) * vA, m);
      }
    `,
  });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  const moon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture([[0, 'rgba(190,210,255,0.55)'],[0.3, 'rgba(140,120,255,0.16)'],[1, 'rgba(140,120,255,0)']], 256),
    color: 0x9fb8ff,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    fog: false,
  }));
  moon.position.set(-520, 480, -900);
  moon.scale.setScalar(520);
  scene.add(moon);

  // ============================================================================
  //  GROUND — tarmac grid + neon perimeter rings
  // ============================================================================

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(750, 56),
    new THREE.MeshBasicMaterial({ map: makeGridTexture(), transparent: true, depthWrite: false })
  );
  ground.rotation.x = -Math.PI / 2;
  sceneGroup.add(ground);

  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  const groundRing = new THREE.Mesh(new THREE.TorusGeometry(118, 1.4, 8, 96), ringMat);
  groundRing.rotation.x = -Math.PI / 2;
  groundRing.position.y = 0.6;
  sceneGroup.add(groundRing);

  const groundRing2 = new THREE.Mesh(new THREE.TorusGeometry(133, 0.5, 6, 96), ringMat.clone());
  groundRing2.material.opacity = 0.14;
  groundRing2.material.color.setHex(0xa44dff);
  groundRing2.rotation.x = -Math.PI / 2;
  groundRing2.position.y = 0.7;
  sceneGroup.add(groundRing2);

  // soft light-pollution pool under the ship
  const groundGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture([[0, 'rgba(122,60,255,0.22)'],[0.5, 'rgba(122,60,255,0.07)'],[1, 'rgba(122,60,255,0)']], 256),
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  }));
  groundGlow.position.set(0, 1.2, 0);
  groundGlow.scale.setScalar(420);
  sceneGroup.add(groundGlow);

  // ---------------------------------------------------------------------------
  //  LA-INCIDENT SEARCHLIGHTS — anti-aircraft light batteries whose restless
  //  beams converge on the mothership (Battle of Los Angeles, 1943).
  // ---------------------------------------------------------------------------

  const UP_VECTOR = new THREE.Vector3(0, 1, 0);
  const BEAM_GEO = new THREE.ConeGeometry(70, 260, 24, 1, true);

  const SEARCHLIGHT_UNITS = [
    { pos: [160, 0, -140], color: 0x7766ff },
    { pos: [-170, 0, -150], color: 0x00e5ff },
    { pos: [20, 0, 200], color: 0xff44aa },
    { pos: [-150, 0, 130], color: 0x4dffb8 },
    { pos: [140, 0, 120], color: 0xff8844 },
    { pos: [0, 0, -205], color: 0x66aaff },
    { pos: [-35, 0, 235], color: 0xff6a9a },
  ];
  const searchlights = [];
  for (const sl of SEARCHLIGHT_UNITS) {
    const unit = new THREE.Group();
    unit.position.set(...sl.pos);
    sceneGroup.add(unit);

    // concrete base drum + operator ring
    const housing = new THREE.Mesh(
      new THREE.CylinderGeometry(1.15, 1.4, 1.7, 12),
      new THREE.MeshStandardMaterial({ color: 0x1c2138, metalness: 0.8, roughness: 0.35 })
    );
    housing.position.y = 0.85;
    unit.add(housing);
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(1.15, 0.12, 8, 20),
      new THREE.MeshStandardMaterial({ color: 0x33394f, metalness: 0.6, roughness: 0.5 })
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 1.7;
    unit.add(rim);

    // blazing lens
    const lens = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 12, 8),
      new THREE.MeshBasicMaterial({
        color: sl.color, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      })
    );
    lens.position.y = 1.95;
    unit.add(lens);

    // beam shaft: wide frosted cone + narrow bright white core cone
    const beam = new THREE.Mesh(BEAM_GEO, new THREE.MeshBasicMaterial({
      color: sl.color, transparent: true, opacity: 0.13,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
    }));
    unit.add(beam);
    const core = new THREE.Mesh(BEAM_GEO, new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.26,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
    }));
    unit.add(core);

    // lit ground pool around the housing
    const pool = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture([[0, 'rgba(255,255,255,0.30)'],[0.5, 'rgba(255,255,255,0.08)'],[1, 'rgba(255,255,255,0)']], 128),
      color: sl.color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
    }));
    pool.position.y = 0.35;
    pool.scale.setScalar(11);
    unit.add(pool);

    unit.userData.beam = beam;
    unit.userData.core = core;
    unit.userData.lens = lens;
    unit.userData.quat = new THREE.Quaternion();
    unit.userData.phase = Math.random() * Math.PI * 2;
    searchlights.push(unit);
  }

  /** Aim a battery at a wandering point near the mothership so all beams
   *  converge on the UFO while still sweeping restlessly. */
  function updateSearchlight(unit, dt, t, target) {
    const wig = {
      x: Math.sin(t * 0.6 + unit.userData.phase) * 26,
      y: Math.sin(t * 0.9 + unit.userData.phase * 2) * 15,
      z: Math.cos(t * 0.5 + unit.userData.phase) * 26,
    };
    const dir = new THREE.Vector3(
      target.x + wig.x - unit.position.x,
      target.y + wig.y - unit.position.y,
      target.z + wig.z - unit.position.z
    );
    const len = dir.length();
    const want = new THREE.Quaternion().setFromUnitVectors(UP_VECTOR, dir.normalize());
    unit.userData.quat.slerp(want, Math.min(1, dt * 2.0));
    unit.quaternion.copy(unit.userData.quat);

    const s = len / 260;
    unit.userData.beam.scale.setScalar(s);
    unit.userData.core.scale.setScalar(s);

    const shimmer = 0.8 + 0.2 * Math.sin(t * 4.0 + unit.userData.phase * 6.0);
    unit.userData.beam.material.opacity = 0.13 * shimmer;
    unit.userData.core.material.opacity = 0.26 * shimmer;
    unit.userData.lens.material.opacity = 0.85 + 0.15 * shimmer;
  }

  // ============================================================================
  //  SHARED SHADER GLSL
  // ============================================================================

  const FOG_GLSL = {
    params: 'uniform vec3 uFogColor; uniform float uFogDensity;',
    apply: `
      float fog = 1.0 - exp(-uFogDensity * uFogDensity * vDepth * vDepth);
      col = mix(col, uFogColor, fog);
    `,
  };

  // Building windows: procedurally generated per-facade window grids in the
  // fragment shader, driven by per-instance attributes. No textures, no UV
  // stretching — every building gets a resolution-appropriate window layout.
  const buildingVertexShader = `
    attribute vec3 aScale;
    attribute float aSeed;

    varying vec3 vLocal;
    varying vec3 vDim;
    varying vec3 vColor;
    varying float vSeed;
    varying float vDepth;

    void main() {
      vLocal = position;
      vDim = aScale;
      vSeed = aSeed;
      vColor = instanceColor;
      vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vec4 mv = viewMatrix * wp;
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `;

  const buildingFragmentShader = `
    precision highp float;

    uniform vec3 uWindowColor;
    uniform vec3 uAccent;
    uniform float uAmbient;
    uniform float uRoofGlow;
    uniform float uTime;
    uniform float uOpacity;
    ${FOG_GLSL.params}

    varying vec3 vLocal;
    varying vec3 vDim;
    varying vec3 vColor;
    varying float vSeed;
    varying float vDepth;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main() {
      vec3 lp = vLocal;
      float absX = abs(lp.x);
      float absZ = abs(lp.z);

      bool top  = abs(lp.y) > 0.485;
      bool faceX = !top && absX > 0.485;
      bool faceZ = !top && !faceX && absZ > 0.485;

      // face-local coordinates (face spans [-0.5, 0.5] in u and v)
      float fu = faceX ? lp.z : lp.x;
      float fw = faceX ? vDim.z : vDim.x;
      float fh = vDim.y;
      float fv = lp.y;

      float cols = max(2.0, floor(fw / 1.15));
      float rows = max(2.0, floor(fh / 0.85));

      float cu = (fu + 0.5) * cols;
      float cv = (fv + 0.5) * rows;
      vec2 cell = vec2(floor(cu), floor(cv));
      vec2 f = vec2(fract(cu) - 0.5, fract(cv) - 0.5);

      float r = hash12(cell + vec2(vSeed * 13.7, vSeed * 7.3));
      float inside = step(abs(f.x), 0.27) * step(abs(f.y), 0.31);

      // lit windows flicker individually; upper floors are dimmer
      float litW = smoothstep(0.30, 0.62, r);
      float flick = 0.72 + 0.28 * sin(uTime * (1.5 + r * 4.0) + cell.x * 2.7 + cell.y * 1.9 + vSeed * 40.0);
      float roofDim = 1.0 - smoothstep(0.35, 1.0, cell.y / rows) * 0.8;
      float win = inside * litW * flick * roofDim;

      // base facade: per-building tint + vertical gradient
      vec3 base = vColor * uAmbient * (0.5 + 0.5 * (lp.y + 0.5));
      vec3 col = base + uWindowColor * win * 0.9;

      // rooftop neon edge
      if (top) {
        float edge = clamp(smoothstep(0.36, 0.5, absX) + smoothstep(0.36, 0.5, absZ), 0.0, 1.0);
        col += uAccent * uRoofGlow * edge * (0.55 + 0.45 * sin(uTime * 2.2 + vSeed * 60.0));
      }

      ${FOG_GLSL.apply}

      gl_FragColor = vec4(col * uOpacity, uOpacity);
    }
  `;

  // ============================================================================
  //  CITY PROFILES & CITY GENERATOR
  // ============================================================================

  const CITY_PROFILES = {
    'New York': {

      accent: 0x00e5ff,
      windowColor: 0x9adfff,
      baseTint: 0x23324a,

      spacing: 7.2,

      hMin: 6, hMax: 48,
      wMin: 4.5, wMax: 7.5,

      antennaMinH: 20,
      roofGlow: 1.25,
      landmark: 'empire',
      seed: 1001,
    },
    Paris: {
      name: 'PARIS',
      accent: 0xffb84d,
      windowColor: 0xffc46b,
      baseTint: 0x39331f,
      landmarkRadius: 11,
      radius: 78,
      spacing: 8.6,
      grid: 'organic',
      hMin: 4, hMax: 17,
      wMin: 10, wMax: 20,

    },
    Berlin: {

      accent: 0xa44dff,
      windowColor: 0x6bff9e,
      baseTint: 0x2e2a38,
      landmarkRadius: 9,
      radius: 88,
      spacing: 10.5,
      grid: 'mixed',
      hMin: 7, hMax: 30,
      wMin: 7, wMax: 15,

  /**
   * Procedural city builder.
   * Produces: an InstancedMesh of generic buildings (custom window shader),
   * instanced antenna masts + beacon lights, one landmark per profile, plus
   * per-building bookkeeping for targeting/destruction/reset.
   */
  class CityGenerator {

    static build(profileName) {
      const profile = CITY_PROFILES[profileName];
      const rng = mulberry32(profile.seed);
      const city = {
        profile,
        group: new THREE.Group(),
        buildings: null,
        antennas: null,
        beacons: null,
        landmark: null,
        rubble: [],          // active crumble meshes (cleaned on reset/switch)
        aliveCount: 0,
        total: 0,
      };

      // ---------------- layout generation ----------------
      const list = [];
      const spacing = profile.spacing;
      const cols = Math.floor(profile.radius * 2 / spacing);
      const avoid = profile.landmarkRadius;

      for (let iy = 0; iy < cols; iy++) {
        for (let ix = 0; ix < cols; ix++) {
          // --- street grid (all three profiles derive from a grid; "organic"
          //     for Paris just applies more jitter + randomness) ---
          const x = (ix - (cols - 1) / 2) * spacing + (rng() - 0.5) * (profile.grid === 'organic' ? 3.6 : 1.7);
          const z = (iy - (cols - 1) / 2) * spacing + (rng() - 0.5) * (profile.grid === 'organic' ? 3.6 : 1.7);
          const r2 = x * x + z * z;
          if (r2 > profile.radius * profile.radius) continue;
          if (r2 < avoid * avoid) continue;

          // blocky Berlin: merge some cells into wider slabs
          const w = profile.grid === 'mixed' && rng() < 0.3
            ? profile.wMin + (profile.wMax - profile.wMin) * rng() + 6
            : profile.wMin + (profile.wMax - profile.wMin) * rng();
          const d = profile.grid === 'mixed' && rng() < 0.2
            ? profile.wMin + (profile.wMax - profile.wMin) * rng() + 6
            : profile.wMin + (profile.wMax - profile.wMin) * rng();

          // height falloff from the center (skyscraper core)
          const dist = Math.sqrt(r2) / profile.radius;
          const hFactor = 1.25 - dist * 0.9;
          let h = (profile.hMin + rng() * rng() * (profile.hMax - profile.hMin)) * hFactor;
          if (profile.grid === 'strict' && rng() < 0.045) h *= 1.35; // rare mega-tower

          list.push({
            x, z, w, h, d,
            index: list.length,
            alive: true,
            rotation: profile.grid === 'strict' ? 0 : (rng() - 0.5) * 0.5,
            antennaIndex: -1,
          });
        }
      }

      // ---------------- generic building InstancedMesh ----------------
      const count = list.length;
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      boxGeo.setAttribute('aScale', new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3));
      boxGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(new Float32Array(count), 1));

      const buildingMat = new THREE.ShaderMaterial({
        uniforms: {
          uWindowColor: { value: new THREE.Color(profile.windowColor) },
          uAccent: { value: new THREE.Color(profile.accent) },
          uAmbient: { value: 0.8 },
          uRoofGlow: { value: profile.roofGlow },
          uTime: { value: 0 },
          uOpacity: { value: 1 },
          uFogColor: { value: scene.fog.color },
          uFogDensity: { value: scene.fog.density },
        },
        vertexShader: buildingVertexShader,
        fragmentShader: buildingFragmentShader,
      });

      const mesh = new THREE.InstancedMesh(boxGeo, buildingMat, count);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;

      const quat = new THREE.Quaternion();
      const pos = new THREE.Vector3();
      const scl = new THREE.Vector3();
      const matrix = new THREE.Matrix4();
      const baseColor = new THREE.Color(profile.baseTint);

      const aScaleAttr = boxGeo.attributes.aScale;
      const aSeedAttr = boxGeo.attributes.aSeed;

      list.forEach((b, i) => {
        pos.set(b.x, b.h / 2, b.z);
        quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), b.rotation);
        scl.set(b.w, b.h, b.d);
        matrix.compose(pos, quat, scl);
        mesh.setMatrixAt(i, matrix);
        // per-instance base tint with slight variance
        const variance = 0.85 + rng() * 0.3;
        mesh.setColorAt(i, baseColor.clone().multiplyScalar(variance));
        aScaleAttr.setXYZ(i, b.w, b.h, b.d);
        aSeedAttr.setX(i, rng());
      });
      aScaleAttr.needsUpdate = true;
      aSeedAttr.needsUpdate = true;
      city.buildings = { mesh, list, matrix: matrix, pos: pos, quat: quat, scl: scl };
      // keep a pristine copy of the instance colors so hover highlights can be undone
      city.buildings.origColors = mesh.instanceColor.array.slice();
      city.aliveCount = count;
      city.total = count;
      city.group.add(mesh);
      registerFogMaterial(buildingMat);

      // ---------------- rooftop antenna masts ----------------
      const antennaList = [];
      list.forEach(b => {
        const chance = b.h >= profile.antennaMinH ? profile.antennaChance : profile.antennaChance * 0.3;
        if (rng() < chance) antennaList.push(b);
      });
      if (antennaList.length > 0) {
        const mastGeo = new THREE.CylinderGeometry(0.06, 0.1, 1, 6, 1, true);
        const mastMat = new THREE.MeshBasicMaterial({
          color: 0x44ccff, transparent: true, opacity: 0.85,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const masts = new THREE.InstancedMesh(mastGeo, mastMat, antennaList.length);
        masts.frustumCulled = false;
        antennaList.forEach((b, i) => {
          b.antennaIndex = i;
          const len = 1.5 + rng() * 3;
          b.antennaLen = len;
          pos.set(b.x, b.h / 2 + len / 2, b.z);
          quat.identity();
          scl.set(1, len, 1);
          matrix.compose(pos, quat, scl);
          masts.setMatrixAt(i, matrix);
        });
        city.group.add(masts);
        city.antennas = { mesh: masts, list: antennaList };

        // beacon lights on ~60% of the masts
        const beacons = antennaList.filter(() => rng() < 0.6);
        const beaconGeo = new THREE.SphereGeometry(0.22, 8, 8);
        const beaconMat = new THREE.MeshBasicMaterial({
          color: 0xff5533, transparent: true, opacity: 0.9,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const beaconMesh = new THREE.InstancedMesh(beaconGeo, beaconMat, beacons.length);
        beaconMesh.frustumCulled = false;
        beacons.forEach((b, i) => {
          b.beaconIndex = i;
          b.beaconY = b.h / 2 + 1.6 + rng() * 2.5;
          pos.set(b.x, b.beaconY, b.z);
          quat.identity();
          scl.setScalar(1);
          matrix.compose(pos, quat, scl);
          beaconMesh.setMatrixAt(i, matrix);
        });
        city.group.add(beaconMesh);
        city.beacons = { mesh: beaconMesh, material: beaconMat, list: beacons };
      }

      // ---------------- landmark ----------------
      const landmark = CityGenerator[`build${profile.landmark[0].toUpperCase()}${profile.landmark.slice(1)}Landmark`](profile);
      landmark.alive = true;
      landmark.isLandmark = true;
      landmark.kind = 'landmark';
      landmark.height = landmark.group.userData.height;
      city.landmark = landmark;
      city.group.add(landmark.group);

      return city;
    }

    // ---------- landmark builders ----------

    static buildEmpireLandmark(profile) {
      const group = new THREE.Group();
      const facadeTex = makeFacadeTexture(new THREE.Color(profile.windowColor), 4242);
      const mat = new THREE.MeshStandardMaterial({

        map: facadeTex,
        emissive: 0xffffff,

        emissiveIntensity: 0.85,

      });
      const tiers = [
        { w: 9, h: 16, d: 9 },
        { w: 7.4, h: 13, d: 7.4 },
        { w: 5.9, h: 10.5, d: 5.9 },
        { w: 4.5, h: 8, d: 4.5 },
        { w: 3.3, h: 6.5, d: 3.3 },

      let y = 0;
      tiers.forEach(t => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), mat);
        m.position.y = y + t.h / 2;
        y += t.h;
        group.add(m);
      });
      const spire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.5, 9, 8),
        new THREE.MeshBasicMaterial({ color: 0x9adfff, emissive: 0x9adfff, emissiveIntensity: 1.2 })
      );
      spire.position.y = y + 4.5;
      group.add(spire);
      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xff2d2d, emissive: 0xff2d2d, emissiveIntensity: 2 })
      );
      beacon.position.y = y + 9;
      group.add(beacon);
      const light = new THREE.PointLight(0xff2d2d, 500, 90, 1.8);
      light.position.y = y + 8;
      light.userData.origIntensity = light.intensity;
      group.add(light);
      group.userData.height = y + 9;
      // remember the pristine look for "Reset City"
      mat.userData.orig = { e: mat.emissive.clone(), ei: mat.emissiveIntensity, c: mat.color.clone() };
      return { group };
    }

    static buildEiffelLandmark(profile) {
      const group = new THREE.Group();
      const iron = new THREE.MeshStandardMaterial({
        color: 0x4a3a56, metalness: 0.75, roughness: 0.45,

      });
      const platformMat = new THREE.MeshStandardMaterial({

      // remember the pristine look for "Reset City"
      iron.userData.orig = { e: iron.emissive.clone(), ei: iron.emissiveIntensity, c: iron.color.clone() };
      platformMat.userData.orig = { e: platformMat.emissive.clone(), ei: platformMat.emissiveIntensity, c: platformMat.color.clone() };
      wire.userData.orig = { c: wire.color.clone() };
      const tiers = [
        { r1: 9.5, r2: 4.4, h: 16 },

      let y = 0;
      tiers.forEach((t, i) => {

        frustum.position.y = y + t.h / 2;

        const lattice = new THREE.Mesh(new THREE.CylinderGeometry(t.r2, t.r1, t.h, 4), wire);
        lattice.position.y = y + t.h / 2;
        group.add(lattice);
        y += t.h;
        if (i < tiers.length - 1) {
          const plat = new THREE.Mesh(new THREE.CylinderGeometry(t.r2 + 0.8, t.r2 + 1.0, 0.7, 4), platformMat);
          plat.position.y = y + 0.35;

          y += 0.7;
        }
      });
      // lantern + spire
      const lantern = new THREE.Mesh(

      band.addColorStop(1, 'rgba(0,255,213,0.05)');

      return { group };

  class Mothership {
    constructor(sceneGroup) {
      const g = new THREE.Group();
      g.position.y = CONFIG.shipHeight;
      sceneGroup.add(g);
      this.group = g;
      this.homePos = new THREE.Vector3(0, CONFIG.shipHeight, 0);
      this.targetPos = this.homePos.clone();
      this.facingYaw = 0;
      this.faceTargetYaw = 0;

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x15172a, metalness: 0.85, roughness: 0.3,
        emissive: 0x2b0f5e, emissiveIntensity: 1.4,
      });
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 3, 64), bodyMat);
      g.add(disc);
      this.disc = disc;

      // glowing belly
      const belly = new THREE.Mesh(
        new THREE.CircleGeometry(13.5, 48),
        new THREE.MeshBasicMaterial({
          color: 0x8a4dff, transparent: true, opacity: 0.42,
          blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
        })
      );
      belly.position.y = -1.5;
      g.add(belly);

      // white-hot core + light
      this.core = new THREE.Mesh(
        new THREE.SphereGeometry(3.4, 24, 16),
        new THREE.MeshBasicMaterial({ color: 0xd9a8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
      );
      g.add(this.core);
      this.coreInner = new THREE.Mesh(
        new THREE.SphereGeometry(1.9, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
      );
      g.add(this.coreInner);
      this.coreLight = new THREE.PointLight(0x9a4dff, 2600, 700, 1.7);
      this.coreLight.position.set(0, 0.5, 0);
      g.add(this.coreLight);

      // rotating neon rings
      this.ringA = new THREE.Group();
      const ra = new THREE.Mesh(
        new THREE.TorusGeometry(19, 0.85, 12, 84),
        new THREE.MeshBasicMaterial({ color: 0x7a3cff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
      );
      ra.rotation.x = Math.PI / 2;
      this.ringA.add(ra);
      g.add(this.ringA);

      this.ringB = new THREE.Group();
      const rb = new THREE.Mesh(
        new THREE.TorusGeometry(23, 0.22, 8, 100),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
      );
      rb.rotation.x = Math.PI / 2;
      this.ringB.add(rb);
      g.add(this.ringB);

      const rc = new THREE.Mesh(
        new THREE.TorusGeometry(26.5, 0.09, 6, 120),
        new THREE.MeshBasicMaterial({ color: 0xff3b6e, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
      );
      rc.rotation.x = Math.PI / 2;
      g.add(rc);
      this.ringC = rc;

      // rim lights
      const rimMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const rim = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 10), rimMat);
        rim.position.set(Math.cos(a) * 16.2, -0.4, Math.sin(a) * 16.2);
        g.add(rim);
      }

      // laser emitter (under-belly)
      this.emitterMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.28,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      });
      const emitter = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 4.2, 1.4, 32), this.emitterMat);
      emitter.position.y = -2.4;
      g.add(emitter);
      this.emitter = emitter;

      // big soft aura sprite
      this.auraMat = new THREE.SpriteMaterial({
        map: makeGlowTexture([[0, 'rgba(150,90,255,0.5)'],[0.4, 'rgba(122,60,255,0.16)'],[1, 'rgba(122,60,255,0)']], 256),
        color: 0x9a4dff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      });
      const aura = new THREE.Sprite(this.auraMat);
      aura.scale.setScalar(105);
      g.add(aura);
    }

    faceToward(yaw) {
      this.faceTargetYaw = yaw;
    }

    driftTo(x, z) {
      const r = Math.min(Math.hypot(x, z), 42);
      const a = Math.atan2(z, x);
      this.targetPos.set(Math.cos(a) * r, CONFIG.shipHeight, Math.sin(a) * r);
    }

    returnHome() {
      this.targetPos.copy(this.homePos);
    }

    bellyWorld(target) {
      target.set(this.group.position.x, this.group.position.y - 2.4, this.group.position.z);
      return target;
    }

    update(dt, time) {
      // yaw toward the attack target (shortest-path easing)
      const yawDelta = normalizeAngle(this.faceTargetYaw, this.facingYaw) - this.facingYaw;
      this.facingYaw += yawDelta * Math.min(1, dt * 3);
      this.group.rotation.y = this.facingYaw;

      // hover drift toward the target / home
      const p = this.group.position;
      const k = Math.min(1, dt * 2.2);
      p.x += (this.targetPos.x - p.x) * k;
      p.z += (this.targetPos.z - p.z) * k;

      // bob + spin
      this.group.position.y = CONFIG.shipHeight + Math.sin(time * 0.9) * 1.4;
      this.disc.rotation.y += dt * 0.18;
      this.ringA.rotation.y += dt * 0.55;
      this.ringB.rotation.y -= dt * 0.85;
      this.ringC.rotation.z += dt * 0.3;

      // aura + core pulse
      this.auraMat.opacity = 0.5 + 0.15 * Math.sin(time * 2.1);
      this.core.material.opacity = 0.85 + 0.15 * Math.sin(time * 3.2);
      this.coreInner.material.opacity = 0.7 + 0.3 * Math.sin(time * 5.1);
    }
  }

  // ============================================================================
  //  SCOUT UFOs — small saucers patrolling the city sky under the mothership
  // ============================================================================

  class ScoutShip {
    constructor(sceneGroup, cfg) {
      const g = new THREE.Group();
      g.position.set(Math.cos(cfg.phase) * cfg.radius, cfg.height, Math.sin(cfg.phase) * cfg.radius);
      sceneGroup.add(g);
      this.group = g;
      this.cfg = cfg;

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x20243e, metalness: 0.85, roughness: 0.3,
        emissive: new THREE.Color(cfg.color), emissiveIntensity: 0.55,
      });
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 1.0, 24), bodyMat);
      g.add(disc);
      this.disc = disc;

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1.3, 16, 10),
        new THREE.MeshStandardMaterial({
          color: 0x26303c, metalness: 0.5, roughness: 0.2,
          emissive: 0xa8dcff, emissiveIntensity: 0.9,
        })
      );
      dome.position.y = 0.85;
      g.add(dome);

      const belly = new THREE.Mesh(
        new THREE.CircleGeometry(3.0, 20),
        new THREE.MeshBasicMaterial({
          color: cfg.color, transparent: true, opacity: 0.55,
          blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
        })
      );
      belly.position.y = -0.5;
      g.add(belly);

      const rimMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(cfg.color).multiplyScalar(1.6),
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      });
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const rim = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), rimMat);
        rim.position.set(Math.cos(a) * 3.6, -0.25, Math.sin(a) * 3.6);
        g.add(rim);
      }

      // faint search beam pointing down at the city
      this.beam = new THREE.Mesh(
        new THREE.ConeGeometry(10, 64, 20, 1, true),
        new THREE.MeshBasicMaterial({
          color: cfg.color, transparent: true, opacity: 0.07,
          blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false,
        })
      );
      this.beam.rotation.x = Math.PI; // apex points down
      g.add(this.beam);

      // soft pool of light where the beam kisses the ground
      this.pool = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeGlowTexture([[0, 'rgba(255,255,255,0.20)'],[0.5, 'rgba(255,255,255,0.06)'],[1, 'rgba(255,255,255,0)']], 128),
        color: cfg.color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
      }));
      this.pool.position.y = 1.2;
      sceneGroup.add(this.pool);

      this.light = new THREE.PointLight(cfg.color, 1500, 170, 1.8);
      g.add(this.light);
    }

    update(dt, t) {
      const c = this.cfg;
      c.phase += dt * c.speed;
      const p = this.group.position;
      p.x = Math.cos(c.phase) * c.radius;
      p.z = Math.sin(c.phase) * c.radius;
      p.y = c.height + Math.sin(t * 1.3 + c.phase * 2.0) * 2.4;
      this.group.rotation.y += dt * 0.6;

      // beam length follows the ship's altitude (apex ends at the ground)
      const s = (p.y - 0.5) / 64;
      this.beam.position.y = (p.y - 0.5) / 2;
      this.beam.scale.setScalar(s);
      this.beam.material.opacity = 0.07 * (0.75 + 0.25 * Math.sin(t * 6.0 + c.phase * 4.0));
      this.light.intensity = 1500 * (0.7 + 0.3 * Math.sin(t * 4.0 + c.phase));

      // ground pool follows the beam tip
      this.pool.position.set(p.x, 1.2, p.z);
      this.pool.scale.setScalar(10 + p.y * 0.3);
    }
  }

  class ScoutFleet {
