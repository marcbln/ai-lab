  // ============================================================================
  //  LASER BEAM POOL
  //  A cylinder with an additive glow shader. Beams are pooled and recycled
  //  to keep the draw call / allocation count flat.
  // ============================================================================

  const beamVertexShader = `
    varying float vR;
    varying float vH;
    void main() {
      vR = length(position.xz);
      vH = uv.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const beamFragmentShader = `
    uniform vec3 uColor;
    uniform float uAlpha;
    uniform float uTime;
    uniform float uSeed;
    varying float vR;
    varying float vH;
    void main() {
      float core = exp(-vR * 30.0);
      float glow = exp(-vR * 7.0);
      float body = smoothstep(0.0, 0.12, vH) * (1.0 - smoothstep(0.88, 1.0, vH));
      float flick = 0.72 + 0.28 * sin(uTime * 55.0 + uSeed * 40.0) * sin(uTime * 13.0 + uSeed * 7.0);
      vec3 col = uColor * (core * 2.6 + glow * 0.9) * body * uAlpha * flick;
      gl_FragColor = vec4(col, (core * 0.85 + glow * 0.4) * body * uAlpha * flick);
    }
  `;

  class BeamPool {
    constructor(sceneGroup) {
      this.sceneGroup = sceneGroup;
      this.pool = [];
      this.active = [];
      for (let i = 0; i < CONFIG.maxBeams; i++) {
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uColor: { value: new THREE.Color(CONFIG.beamColor) },
            uAlpha: { value: 0 },
            uTime: { value: 0 },
            uSeed: { value: Math.random() * 100 },
          },
          vertexShader: beamVertexShader,
          fragmentShader: beamFragmentShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 24, 1, true), mat);
        mesh.visible = false;
        mesh.renderOrder = 10;
        sceneGroup.add(mesh);
        this.pool.push({ mesh, mat });
      }
    }

    acquire() {
      const b = this.pool.pop() || this.pool[this.pool.length - 1];
      if (b) {
        this.active.push(b);
        b.mesh.visible = true;
      }
      return b;
    }

    release(b) {
      if (!b) return;
      const i = this.active.indexOf(b);
      if (i < 0) return; // already released (killed timeline may call again)
      b.mesh.visible = false;
      b.mat.uniforms.uAlpha.value = 0;
      this.active.splice(i, 1);
      this.pool.push(b);
    }

    setTransform(b, from, to) {
      const mid = from.clone().add(to).multiplyScalar(0.5);
      const dir = to.clone().sub(from);
      const len = dir.length();
      b.mesh.position.copy(mid);
      b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      b.mesh.scale.set(0.001, len, 0.001);
      return len;
    }

    setColor(hex) {
      const c = new THREE.Color(hex);
      for (const b of this.pool) b.mat.uniforms.uColor.value.copy(c);
      for (const b of this.active) b.mat.uniforms.uColor.value.copy(c);
    }

    update(time) {
      for (const b of this.active) b.mat.uniforms.uTime.value = time;
    }
  }

  // ============================================================================
  //  IMPACT EFFECTS — shockwave ring (plane shader), flash sprite, point light
  // ============================================================================

  const ringVertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const ringFragmentShader = `
    uniform vec3 uColor;
    uniform float uProgress;
    varying vec2 vUv;
    void main() {
      float r = length(vUv - 0.5) * 2.0;
      float center = 0.03 + uProgress * 0.9;
      float width = 0.09 + (1.0 - uProgress) * 0.16;
      float g = exp(-pow((r - center) / width, 2.0));
      vec3 col = uColor * (g * 2.2 + pow(g, 4.0) * 3.0);
      float a = (1.0 - uProgress);
      gl_FragColor = vec4(col * a, g * a * 1.4);
    }
  `;

  const FLASH_TEXTURE = makeGlowTexture([
    [0, 'rgba(255,255,255,1)'],
    [0.3, 'rgba(255,200,150,0.9)'],
    [0.7, 'rgba(255,120,60,0.25)'],
    [1, 'rgba(255,120,60,0)'],
  ]);

  class ImpactFX {
    constructor(sceneGroup) {
      this.sceneGroup = sceneGroup;
      this.rings = [];
      this.flashes = [];
      this.lights = [];
      this.spareRings = [];
      this.spareFlashes = [];
      this.spareLights = [];
      this.activeRings = [];

      for (let i = 0; i < CONFIG.maxRings; i++) {
        const mat = new THREE.ShaderMaterial({
          uniforms: { uColor: { value: new THREE.Color(0xff6a00) }, uProgress: { value: 0 } },
          vertexShader: ringVertexShader,
          fragmentShader: ringFragmentShader,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.visible = false;
        mesh.renderOrder = 11;
        sceneGroup.add(mesh);
        this.spareRings.push({ mesh, mat, progress: 1 });
      }

      for (let i = 0; i < CONFIG.maxFlashes; i++) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: FLASH_TEXTURE, color: 0xffffff, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
        }));
        sprite.visible = false;
        sprite.renderOrder = 12;
        sceneGroup.add(sprite);
        this.spareFlashes.push(sprite);
      }

      for (let i = 0; i < CONFIG.maxLights; i++) {
        const light = new THREE.PointLight(0xff6a00, 0, 130, 1.8);
        sceneGroup.add(light);
        this.spareLights.push(light);
      }
    }

    /** Spawn ring + flash + light at `pos` (world). Returns the ring object. */
    spawn(pos, color = 0xff6a00, scale = 1) {
      const ring = this.spareRings.pop();
      const flash = this.spareFlashes.pop();
      const light = this.spareLights.pop();
      const out = {};

      if (ring) {
        ring.progress = 0;
        ring.mesh.visible = true;
        ring.mat.uniforms.uColor.value.setHex(color);
        ring.mesh.position.copy(pos);
        ring.mesh.position.y = 0.25;
        ring.mesh.scale.setScalar(26 * scale); // expands to ~12 world units at scale 1
        this.activeRings.push(ring);
        out.ring = ring;
      }
      if (flash) {
        flash.visible = true;
        flash.material.color.setHex(color);
        flash.position.copy(pos);
        flash.position.y = 1.5;
        flash.scale.setScalar(0.1);
        gsap.to(flash.scale, { x: 46 * scale, y: 46 * scale, duration: 0.42, ease: 'power2.out' });
        gsap.fromTo(flash.material, { opacity: 1 }, {
          opacity: 0, duration: 0.5, ease: 'power2.in',
          onComplete: () => {
            flash.visible = false;
            flash.material.opacity = 0;
            this.spareFlashes.push(flash);
          },
        });
        out.flash = flash;
      }
      if (light) {
        light.color.setHex(color);
        light.position.copy(pos);
        light.position.y = 3;
        light.intensity = 3200 * scale;
        gsap.to(light, { intensity: 0, duration: 0.45, ease: 'power2.in',
          onComplete: () => this.spareLights.push(light) });
        out.light = light;
      }
      return out;
    }

    releaseRing(ring) {
      ring.mesh.visible = false;
      const i = this.activeRings.indexOf(ring);
      if (i >= 0) this.activeRings.splice(i, 1);
      this.spareRings.push(ring);
    }

    releaseAll() {
      for (const r of this.activeRings.slice()) this.releaseRing(r);
      // flashes / lights self-release via their own gsap onComplete callbacks
    }

    update(dt) {
      for (const r of this.activeRings) {
        r.progress = Math.min(1, r.progress + dt / 0.8);
        r.mat.uniforms.uProgress.value = r.progress;
        if (r.progress >= 1) this.releaseRing(r);
      }
    }
  }

  // ============================================================================
  //  PARTICLE POOL — fire (additive) & smoke (normal), custom alpha shader
  //  Physics-lite: buoyant rise, drag, gravity, growth, fade.
  // ============================================================================

  class ParticlePool {
    constructor(sceneGroup, opts) {
      this.max = opts.max;
      this.blending = opts.blending;
      this.gravity = opts.gravity;
      this.drag = opts.drag;
      this.growth = opts.growth;
      this.sceneGroup = sceneGroup;

      this.pos = new Float32Array(this.max * 3);
      this.vel = new Float32Array(this.max * 3);
      this.c0 = new Float32Array(this.max * 3);      // start color
      this.c1 = new Float32Array(this.max * 3);      // end color
      this.colorAttr = new Float32Array(this.max * 3); // GPU color attribute
      this.life = new Float32Array(this.max);
      this.maxLife = new Float32Array(this.max);
      this.size0 = new Float32Array(this.max);
      this.size = new Float32Array(this.max);
      this.alpha = new Float32Array(this.max);
      this.cursor = 0;
      this.aliveCount = 0;

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(this.colorAttr, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: DOT_TEXTURE },
          uPixelRatio: { value: renderer.getPixelRatio() },
          uHeight: { value: window.innerHeight },
          uFogColor: { value: scene.fog.color },
          uFogDensity: { value: scene.fog.density },
        },
        vertexShader: `
          attribute vec3 color;
          attribute float aSize;
          attribute float aAlpha;
          uniform float uPixelRatio;
          uniform float uHeight;
          varying vec3 vColor;
          varying float vAlpha;
          varying float vDist;
          void main() {
            vColor = color;
            vAlpha = aAlpha;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vDist = -mv.z;
            gl_PointSize = aSize * uPixelRatio * uHeight * 0.5 * projectionMatrix[1][1] / -mv.z;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform vec3 uFogColor;
          uniform float uFogDensity;
          varying vec3 vColor;
          varying float vAlpha;
          varying float vDist;
          void main() {
            vec4 t = texture2D(uMap, gl_PointCoord);
            vec3 col = vColor;
            float fog = 1.0 - exp(-uFogDensity * uFogDensity * vDist * vDist);
            col = mix(col, uFogColor, fog);
            float a = vAlpha * t.a;
            if (a < 0.02) discard;
            gl_FragColor = vec4(col * a, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: this.blending,
      });

      this.points = new THREE.Points(geo, mat);
      this.points.frustumCulled = false;
      this.points.renderOrder = 20;
      sceneGroup.add(this.points);
      registerFogMaterial(mat);
    }

    spawn(x, y, z, opts) {
      const n = Math.min(opts.count, this.max);
      for (let i = 0; i < n; i++) {
        const idx = this.cursor;
        this.cursor = (this.cursor + 1) % this.max;
        const i3 = idx * 3;
        const theta = Math.random() * Math.PI * 2;
        const speed = opts.speedMin + Math.random() * (opts.speedMax - opts.speedMin);
        this.pos[i3] = x;
        this.pos[i3 + 1] = y;
        this.pos[i3 + 2] = z;
        this.vel[i3] = Math.cos(theta) * speed * (0.4 + Math.random() * 0.6);
        this.vel[i3 + 1] = opts.upBias * (0.6 + Math.random() * 0.8);
        this.vel[i3 + 2] = Math.sin(theta) * speed * (0.4 + Math.random() * 0.6);
        const t = Math.random();
        this.c0[i3] = opts.color0[0] + t * (opts.color1[0] - opts.color0[0]);
        this.c0[i3 + 1] = opts.color0[1] + t * (opts.color1[1] - opts.color0[1]);
        this.c0[i3 + 2] = opts.color0[2] + t * (opts.color1[2] - opts.color0[2]);
        this.c1[i3] = opts.color1[0];
        this.c1[i3 + 1] = opts.color1[1];
        this.c1[i3 + 2] = opts.color1[2];
        this.life[idx] = 0;
        this.maxLife[idx] = opts.lifeMin + Math.random() * (opts.lifeMax - opts.lifeMin);
        this.size0[idx] = opts.sizeMin + Math.random() * (opts.sizeMax - opts.sizeMin);
      }
      this.aliveCount = Math.min(this.aliveCount + n, this.max);
    }

    clear() {
      // mark every slot dead: life >= maxLife with both zeroed
      this.life.fill(0);
      this.maxLife.fill(0);
      this.aliveCount = 0;
      this.alpha.fill(0);
      this.points.geometry.attributes.aAlpha.needsUpdate = true;
    }

    setVisible(v) {
      this.points.visible = v;
    }

    update(dt) {
      const posAttr = this.points.geometry.attributes.position;
      const colAttr = this.points.geometry.attributes.color;
      const sizeAttr = this.points.geometry.attributes.aSize;
      const alphaAttr = this.points.geometry.attributes.aAlpha;
      let dirty = false;

      for (let i = 0; i < this.max; i++) {
        if (this.life[i] >= this.maxLife[i]) {
          if (this.alpha[i] !== 0) { this.alpha[i] = 0; dirty = true; }
          continue;
        }
        dirty = true;
        const i3 = i * 3;
        this.life[i] += dt;
        const k = Math.min(1, this.life[i] / this.maxLife[i]);

        // physics-lite: buoyant rise, drag, gravity
        this.vel[i3 + 1] += this.gravity * dt;
        this.vel[i3] *= Math.pow(this.drag, dt * 60);
        this.vel[i3 + 1] *= Math.pow(this.drag, dt * 60);
        this.vel[i3 + 2] *= Math.pow(this.drag, dt * 60);
        this.pos[i3] += this.vel[i3] * dt;
        this.pos[i3 + 1] += this.vel[i3 + 1] * dt;
        this.pos[i3 + 2] += this.vel[i3 + 2] * dt;

        // color fade color0 -> color1 (smoothstep on lifetime)
        const t = k * k * (3 - 2 * k);
        this.colorAttr[i3] = this.c0[i3] + (this.c1[i3] - this.c0[i3]) * t;
        this.colorAttr[i3 + 1] = this.c0[i3 + 1] + (this.c1[i3 + 1] - this.c0[i3 + 1]) * t;
        this.colorAttr[i3 + 2] = this.c0[i3 + 2] + (this.c1[i3 + 2] - this.c0[i3 + 2]) * t;

        // size grows (smoke) or shrinks (fire)
        this.size[i] = this.size0[i] * (1 + this.growth * k);
        // alpha: quick fade-in, long fade-out
        this.alpha[i] = Math.min(1, k * 8) * (1 - Math.pow(k, 2.2));
      }

      if (dirty) {
        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;
        sizeAttr.needsUpdate = true;
        alphaAttr.needsUpdate = true;
      }
    }
  }

  const DOT_TEXTURE = makeSoftDotTexture();

  // ============================================================================
  //  CITY TRAFFIC — little cars with glowing headlights cruising the avenues
  // ============================================================================

  const CAR_BODY_PALETTE = [0xd33c3c, 0x3c7ad3, 0xd3b53c, 0xdfe2ea, 0x3cd3a1, 0xa05cd3];
  const CAR_GLASS_MAT = new THREE.MeshStandardMaterial({
    color: 0x0e2030, metalness: 0.2, roughness: 0.15,
    emissive: 0x2c4a66, emissiveIntensity: 0.7,
  });
  const CAR_HEADLIGHT_MAT = new THREE.MeshBasicMaterial({
    color: 0xcfeeff, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  });
  const CAR_TAIL_MAT = new THREE.MeshBasicMaterial({
    color: 0xff2a3c, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  });
  const CAR_WHEEL_MAT = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 1 });

  class CarRig {
    constructor(sceneGroup) {
      this.sceneGroup = sceneGroup;
      this.cars = [];
      for (let i = 0; i < 12; i++) {
        this.cars.push(this.makeCar(CAR_BODY_PALETTE[i % CAR_BODY_PALETTE.length]));
      }
    }

    makeCar(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.9, 0.42, 0.8),
        new THREE.MeshStandardMaterial({
          color, metalness: 0.55, roughness: 0.45,
          emissive: new THREE.Color(color).multiplyScalar(0.16),
        })
      );
      body.position.y = 0.42;
      g.add(body);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.34, 0.7), CAR_GLASS_MAT);
      cabin.position.set(-0.12, 0.78, 0);
      g.add(cabin);
      const wheelGeo = new THREE.BoxGeometry(0.3, 0.3, 0.16);
      for (const [wx, wz] of [[-0.55, 0.44], [-0.55, -0.44], [0.55, 0.44], [0.55, -0.44]]) {
        const w = new THREE.Mesh(wheelGeo, CAR_WHEEL_MAT);
        w.position.set(wx, 0.18, wz);
        g.add(w);
      }
      // headlights at the front (+X), taillights at the back
      const lampGeo = new THREE.SphereGeometry(0.09, 8, 8);
      for (const wz of [-0.3, 0.3]) {
        const hl = new THREE.Mesh(lampGeo, CAR_HEADLIGHT_MAT);
        hl.position.set(0.97, 0.46, wz);
        g.add(hl);
        const tl = new THREE.Mesh(lampGeo, CAR_TAIL_MAT);
        tl.position.set(-0.97, 0.46, wz);
        g.add(tl);
      }
      this.sceneGroup.add(g);
      return g;
    }

    /** Find the cleanest street avenues through the current city, then park
     *  the fleet on them plus a perimeter ring road. */
    place(city) {
      const bld = city.buildings.list;
      const span = city.profile.radius * 0.82;
      const spacing = city.profile.spacing;

      const scored = (axis) => {
        const lanes = [];
        const last = Math.ceil(span / spacing);
        for (let i = -last; i <= last; i++) {
          const lane = (i + 0.5) * spacing;
          // keep the avenues clear of the landmark block
          if (Math.abs(lane) < city.profile.landmarkRadius + 2) continue;
          let pen = 0;
          for (const b of bld) {
            const alongMin = axis === 'x' ? b.z - b.d / 2 : b.x - b.w / 2;
            const alongMax = axis === 'x' ? b.z + b.d / 2 : b.x + b.w / 2;
            if (alongMax < -span || alongMin > span) continue;
            const latMin = axis === 'x' ? b.x - b.w / 2 : b.z - b.d / 2;
            const latMax = axis === 'x' ? b.x + b.w / 2 : b.z + b.d / 2;
            pen = Math.max(pen, Math.min(latMax, lane + 1.3) - Math.max(latMin, lane - 1.3));
          }
          lanes.push({ lane, pen });
        }
        lanes.sort((a, b) => a.pen - b.pen);
        return lanes;
      };

      const xLanes = scored('x').filter(l => l.pen <= 0).slice(0, 3);
      const zLanes = scored('z').filter(l => l.pen <= 0).slice(0, 3);

      let idx = 0;
      const parkOnLane = (laneVal, axis, dir) => {
        const car = this.cars[idx++];
        if (!car) return;
        car.userData = {
          mode: 'lane',
          axis, lane: laneVal,
          dir, speed: 3.4 + Math.random() * 3.4,
          pos: (Math.random() - 0.5) * span * 1.6,
          span,
        };
      };
      xLanes.forEach((L, i) => parkOnLane(L.lane, 'x', i % 2 === 0 ? 1 : -1));
      zLanes.forEach((L, i) => parkOnLane(L.lane, 'z', i % 2 === 0 ? 1 : -1));

      // leftover cars loop around the city on a ring road
      const ringR = city.profile.radius + 7;
      const ringCount = Math.max(1, this.cars.length - idx);
      for (let i = idx; i < this.cars.length; i++) {
        const car = this.cars[i];
        car.userData = {
          mode: 'ring',
          radius: ringR,
          theta: ((i - idx) / ringCount) * Math.PI * 2 + 0.5,
          speed: 4.2 + (i % 3) * 1.2,
        };
      }
    }

    update(dt) {
      for (const car of this.cars) {
        const ud = car.userData;
        if (!ud) continue;
        if (ud.mode === 'lane') {
          ud.pos += ud.dir * ud.speed * dt;
          if (ud.pos > ud.span) { ud.pos = ud.span; ud.dir = -1; }
          if (ud.pos < -ud.span) { ud.pos = -ud.span; ud.dir = 1; }
          if (ud.axis === 'x') car.position.set(ud.pos, 0, ud.lane);
          else car.position.set(ud.lane, 0, ud.pos);
          car.rotation.y = ud.axis === 'x'
            ? (ud.dir > 0 ? 0 : Math.PI)
            : (ud.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
        } else {
          ud.theta += (ud.speed * dt) / ud.radius;
          const r = ud.radius;
          car.position.set(Math.cos(ud.theta) * r, 0, Math.sin(ud.theta) * r);
          car.rotation.y = ud.theta + Math.PI / 2;
        }
      }
    }
  }

  // ============================================================================
  //  TARGETING DOT POOL
  // ============================================================================

  class DotPool {
    constructor(sceneGroup) {
      this.spares = [];
      this.sceneGroup = sceneGroup;
      for (let i = 0; i < CONFIG.maxDots; i++) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: makeGlowTexture([[0, 'rgba(255,80,120,1)'],[0.3, 'rgba(255,80,120,0.55)'],[1, 'rgba(255,80,120,0)']], 64),
          transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
        }));
        sprite.visible = false;
        sprite.renderOrder = 13;
        sceneGroup.add(sprite);
        this.spares.push(sprite);
      }
    }

    acquire(pos) {
      const s = this.spares.pop();
      if (!s) return null;
      s.userData.released = false;
      s.visible = true;
      s.position.copy(pos);
      s.scale.setScalar(0.01);
      gsap.to(s.scale, { x: 3.2, y: 3.2, duration: 0.18, ease: 'power2.out' });
      gsap.to(s.material, { opacity: 1, duration: 0.12 });
      return s;
    }

    release(s) {
      if (!s || s.userData.released) return; // guard against double release
      s.userData.released = true;
      gsap.killTweensOf(s.material);
      gsap.to(s.material, { opacity: 0, duration: 0.18, onComplete: () => {
        s.visible = false;
        s.material.opacity = 0;
        this.spares.push(s);
      }});
    }
  }

  // ============================================================================
  //  THE GAME ORCHESTRATOR
  // ============================================================================

  class Game {
    constructor() {
      this.city = null;
      this.cityName = null;
      this.switching = false;
      this.mothership = null;
      this.beams = null;
      this.fx = null;
      this.dots = null;
      this.firePool = null;
      this.smokePool = null;
      this.scouts = null;
      this.cars = null;
      this.aliensWon = false;
      this.timers = new Set();     // tracked gsap delayedCalls
      this.autoTimer = null;
      this.shakeAmp = 0;
      this.time = 0;
      this.hovered = null;         // hovered building (for highlight)
      this.lastPrune = 0;
    }

    start() {
      this.mothership = new Mothership(sceneGroup);
      this.beams = new BeamPool(sceneGroup);
      this.fx = new ImpactFX(sceneGroup);
      this.dots = new DotPool(sceneGroup);
      this.firePool = new ParticlePool(sceneGroup, {
        max: CONFIG.fireMax, blending: THREE.AdditiveBlending,
        gravity: -6, drag: 0.985, growth: -0.5,
      });
      this.smokePool = new ParticlePool(sceneGroup, {
        max: CONFIG.smokeMax, blending: THREE.NormalBlending,
        gravity: 3.5, drag: 0.975, growth: 2.0,
      });
      this.scouts = new ScoutFleet(sceneGroup);
      this.cars = new CarRig(sceneGroup);
      this.switchCity(params.city, true);
    }

    // ---------------- city management ----------------

    switchCity(name, immediate = false) {
      if (this.switching || name === this.cityName) return;
      if (immediate) {
        this.buildCity(name);
        this.scheduleAutoAttack();
        return;
      }
      this.switching = true;
      this.cancelAll();
      this.mothership.returnHome();

      const old = this.city;
      const tl = gsap.timeline({
        onComplete: () => {
          this.disposeCity(old);
          this.buildCity(name);
          this.switching = false;
          this.scheduleAutoAttack();
          // dramatic arrival strike on the fresh city
          this.track(gsap.delayedCall(1.1, () => this.randomAttack()));
        },
      });
      tl.to(old.group.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.85, ease: 'power2.in' }, 0)
        .add(() => {
          // dissolve sparks at the old city's heart
          this.firePool.spawn(0, 10, 0, {
            count: 120, speedMin: 2, speedMax: 12, upBias: 16,
            color0: [0.4, 0.5, 1], color1: [0.05, 0.1, 0.3],
            lifeMin: 0.4, lifeMax: 1.4, sizeMin: 0.5, sizeMax: 2.2,
          });
        }, 0.35);

      // HUD label swap
      const label = document.getElementById('cityLabel');
      gsap.to(label, { opacity: 0, duration: 0.3, onComplete: () => {
        label.textContent = CITY_PROFILES[name].name;
        gsap.fromTo(label, { opacity: 0, letterSpacing: '14px' }, { opacity: 1, letterSpacing: '6px', duration: 0.6, ease: 'power2.out' });
      }});
    }

    buildCity(name) {
      this.city = CityGenerator.build(name);
      this.cityName = name;
      this.city.group.scale.setScalar(0.001);
      sceneGroup.add(this.city.group);
      gsap.to(this.city.group.scale, { x: 1, y: 1, z: 1, duration: 1.1, ease: 'power2.out' });
      // arrival shockwave
      this.fx.spawn(new THREE.Vector3(0, 0, 0), 0x00e5ff, 1.6);
      this.updateIntegrity();
      this.cars.place(this.city);
      // fresh round — the aliens can lose again
      if (this.aliensWon) {
        this.aliensWon = false;
        gsap.to('#victory', { opacity: 0, duration: 0.35 });
      }
      // spawn a few ambient particles drifting up from the city
      this.spawnAmbientSmoke();
    }

    spawnAmbientSmoke() {
      for (let i = 0; i < 6; i++) {
        this.track(gsap.delayedCall(0.4 + i * 0.5, () => {
          if (!this.city) return;
          const b = this.randomAliveBuilding();
          if (!b) return;
          this.smokePool.spawn(b.x, b.h * 0.7, b.z, {
            count: 8, speedMin: 0.6, speedMax: 1.6, upBias: 4,
            color0: [0.25, 0.24, 0.28], color1: [0.08, 0.08, 0.1],
            lifeMin: 2, lifeMax: 4, sizeMin: 1.5, sizeMax: 3.5,
          });
        }));
      }
    }

    disposeCity(city) {
      sceneGroup.remove(city.group);
      // remove leftover rubble meshes
      for (const r of city.rubble) {
        sceneGroup.remove(r.group);
        r.group.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.dispose()); }
        });
      }
      city.rubble.length = 0;
      city.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(m => {
            if (m.map) m.map.dispose();
            if (m.emissiveMap) m.emissiveMap.dispose();
            m.dispose();
          });
        }
      });
      // fade out leftover particles from this city
      this.firePool.clear();
      this.smokePool.clear();
    }

    // ---------------- targeting / attacks ----------------

    aliveBuildings() {
      if (!this.city) return [];
      return this.city.buildings.list.filter(b => b.alive);
    }

    randomAliveBuilding() {
      const alive = this.aliveBuildings();
      if (alive.length === 0) return null;
      return alive[(Math.random() * alive.length) | 0];
    }

    randomTarget() {
      // 25% chance to hit the landmark if it is still standing
      if (this.city && this.city.landmark.alive && Math.random() < 0.25) return this.city.landmark;
      return this.randomAliveBuilding();
    }

    fireAt(building) {
      if (!building || !building.alive || this.switching) return;
      const ship = this.mothership;

      // face + hover toward the target
      const dx = building.x - ship.group.position.x;
      const dz = building.z - ship.group.position.z;
      ship.faceToward(Math.atan2(dx, dz));
      ship.driftTo(building.x, building.z);

      // targeting dot pulses on the roof while the ship lines up
      const topY = building.kind === 'landmark' ? building.height * 0.8 : building.h * 0.8;
      const dot = this.dots.acquire(new THREE.Vector3(building.x, topY, building.z));

      // emitter charge flash
      gsap.to(ship.emitterMat, { opacity: 0.95, duration: 0.16, yoyo: true, repeat: 1, onComplete: () => ship.emitterMat.opacity = 0.28 });

      // fire!
      this.track(gsap.delayedCall(0.22, () => {
        if (!building.alive || this.switching || !this.city) { this.dots.release(dot); return; }
        const beam = this.beams.acquire();
        if (!beam) { this.dots.release(dot); return; }
        const from = ship.bellyWorld(new THREE.Vector3());
        const to = new THREE.Vector3(building.x, topY, building.z);
        this.beams.setTransform(beam, from, to);

        const tl = gsap.timeline();
        tl.to(beam.mesh.scale, { x: 1.15, z: 1.15, duration: 0.16, ease: 'power2.out' }, 0)
          .to(beam.mat.uniforms.uAlpha, { value: 1, duration: 0.1 }, 0)
          .add(() => this.dots.release(dot), 0.05)
          .call(() => this.impact(building), undefined, 0.24)
          .to(beam.mesh.scale, { x: 0.01, z: 0.01, y: 0.3, duration: 0.4, ease: 'power2.in' }, 0.4)
          .to(beam.mat.uniforms.uAlpha, { value: 0, duration: 0.3 }, 0.4)
          .call(() => this.beams.release(beam), undefined, 0.85);
        this.track(tl);
      }));
    }

    impact(building) {
      if (!building.alive) return;
      const gx = building.x, gz = building.z;
      // ground FX at the impact column
      this.fx.spawn(new THREE.Vector3(gx, 0.2, gz), 0xff6a00, 1);
      // second, tighter ring for punch
      this.fx.spawn(new THREE.Vector3(gx, 0.2, gz), 0xffe9b0, 0.45);

      // fire + smoke at the base of the building
      const boomY = building.kind === 'landmark' ? building.height * 0.45 : building.h * 0.4;
      this.explode(gx, boomY, gz, 1);

      // crumble the building
      this.destroyBuilding(building);

      // camera kick
      const dist = camera.position.distanceTo(new THREE.Vector3(gx, 20, gz));
      this.shakeAmp = Math.min(this.shakeAmp + 0.5 / (1 + dist * 0.012), 0.65);
    }

    explode(x, y, z, power = 1) {
      if (!params.particles) return;
      this.firePool.spawn(x, y, z, {
        count: Math.round(70 * power),
        speedMin: 4, speedMax: 6 + 12 * power, upBias: 7 + 9 * power,
        color0: [1.0, 0.72, 0.2], color1: [0.55, 0.08, 0.02],
        lifeMin: 0.5, lifeMax: 1.6, sizeMin: 0.5, sizeMax: 2.3,
      });
      this.smokePool.spawn(x, y, z, {
        count: Math.round(40 * power),
        speedMin: 1.5, speedMax: 4 + 3 * power, upBias: 5 + 5 * power,
        color0: [0.34, 0.29, 0.31], color1: [0.06, 0.06, 0.08],
        lifeMin: 1.2, lifeMax: 2.8, sizeMin: 1.4, sizeMax: 4.2,
      });
    }

    destroyBuilding(building) {
      if (!building.alive) return;
      building.alive = false;
      if (this.hovered === building) this.hovered = null;
      if (this.city) this.city.aliveCount = Math.max(0, this.city.aliveCount - 1);

      // every building AND the landmark lies in ruins -> the aliens won
      if (this.city && this.city.aliveCount === 0 && !this.city.landmark.alive) {
        this.alienVictory();
      }

      if (building.kind === 'landmark') {
        this.collapseLandmark(building);
        return;
      }

      const b = building;
      const city = this.city;
      const mesh = city.buildings.mesh;

      // shrink the instanced building away
      const m = new THREE.Matrix4().makeScale(0.001, 0.001, 0.001);
      m.setPosition(b.x, 0.001, b.z);
      mesh.setMatrixAt(b.index, m);
      mesh.instanceMatrix.needsUpdate = true;

      // kill its antenna + beacon
      if (b.antennaIndex >= 0 && city.antennas) {
        const am = new THREE.Matrix4().makeScale(0.001, 0.001, 0.001);
        am.setPosition(b.x, 0.001, b.z);
        city.antennas.mesh.setMatrixAt(b.antennaIndex, am);
        city.antennas.mesh.instanceMatrix.needsUpdate = true;
      }
      if (b.beaconIndex >= 0 && city.beacons) {
        const bm = new THREE.Matrix4().makeScale(0.001, 0.001, 0.001);
        bm.setPosition(b.x, 0.001, b.z);
        city.beacons.mesh.setMatrixAt(b.beaconIndex, bm);
        city.beacons.mesh.instanceMatrix.needsUpdate = true;
      }

      // charred rubble stub that "crumples"
      const rubble = new THREE.Group();
      const stub = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, b.h, b.d),
        new THREE.MeshStandardMaterial({
          color: 0x0a0a0c, roughness: 1, metalness: 0,
          emissive: 0xff2a00, emissiveIntensity: 0.35,
        })
      );
      stub.position.y = b.h / 2;
      rubble.add(stub);
      rubble.position.set(b.x, 0, b.z);
      rubble.rotation.z = (Math.random() - 0.5) * 0.08;
      rubble.rotation.x = (Math.random() - 0.5) * 0.08;
      rubble.scale.y = 1;
      sceneGroup.add(rubble);
      city.rubble.push(rubble);

      const tl = gsap.timeline({
        onComplete: () => {
          sceneGroup.remove(rubble);
          const i = city.rubble.indexOf(rubble);
          if (i >= 0) city.rubble.splice(i, 1);
          stub.geometry.dispose();
          stub.material.dispose();
        },
      });
      tl.to(rubble.scale, { y: 0.1, duration: 0.85, ease: 'power2.in' }, 0)
        .to(rubble.scale, { x: 0.05, z: 0.05, duration: 0.3, ease: 'power2.in' }, 0.55)
        .to(rubble.position, { y: -0.2, duration: 0.4 }, 0.55);

      this.updateIntegrity();
    }

    collapseLandmark(lm) {
      const group = lm.group;
      // char the materials
      group.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (m.emissive !== undefined) {
              m.emissive = new THREE.Color(0xff2200);
              m.emissiveIntensity = 1.4;
            } else if (m.color !== undefined) {
              m.color.setHex(0x331111);
            }
          });
        }
        if (o.isPointLight) {
          if (o.userData.origIntensity === undefined) o.userData.origIntensity = o.intensity;
          gsap.to(o, { intensity: 0, duration: 0.5 });
        }
      });
      gsap.to(group.scale, { y: 0.12, duration: 0.9, ease: 'power2.in' });
      gsap.to(group.rotation, { z: (Math.random() - 0.5) * 0.12, duration: 0.9, ease: 'power2.in' });
      this.track(gsap.delayedCall(2.4, () => { group.visible = false; }));
      // extra debris
      this.explode(0, lm.height * 0.5, 0, 1.6);
      this.updateIntegrity();
    }

    updateIntegrity() {
      if (!this.city) return;
      const pct = Math.round((this.city.aliveCount / this.city.total) * 100);
      const el = document.getElementById('integrityVal');
      el.textContent = pct + '%';
      el.style.color = pct > 60 ? '#6bff9e' : pct > 30 ? '#ffd166' : '#ff5d7a';
      gsap.fromTo(el, { scale: 1.35 }, { scale: 1, duration: 0.35, ease: 'power2.out' });
    }

    alienVictory() {
      if (this.aliensWon) return;
      this.aliensWon = true;
      console.log('%c👽 The Aliens won.', 'color:#ff5d7a;font-size:18px;font-weight:bold;text-shadow:0 0 10px #ff3b6e;');
      const el = document.getElementById('victory');
      gsap.killTweensOf(el);
      gsap.fromTo(el, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' });
      this.shakeAmp = Math.max(this.shakeAmp, 0.5);
    }

    // ---------------- auto invasion / armageddon ----------------

    scheduleAutoAttack() {
      if (this.autoTimer) this.autoTimer.kill();
      if (params.intensity <= 0) { this.autoTimer = null; return; }
      const interval = 13 * Math.pow(0.82, params.intensity) + 0.8;
      const jitter = (Math.random() - 0.5) * interval * 0.5;
      this.autoTimer = this.track(gsap.delayedCall(Math.max(0.6, interval + jitter), () => {
        this.randomAttack();
        this.scheduleAutoAttack();
      }));
    }

    randomAttack() {
      if (this.switching || !this.city) return;
      const target = this.randomTarget();
      if (!target) return;
      this.fireAt(target);
    }

    armageddon() {
      if (!this.city || this.switching) return;
      const targets = this.aliveBuildings();
      // shuffle
      for (let i = targets.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [targets[i], targets[j]] = [targets[j], targets[i]];
      }
      const n = Math.min(13, targets.length);
      for (let i = 0; i < n; i++) {
        const b = targets[i];
        this.track(gsap.delayedCall(0.25 + i * 0.1, () => { if (b.alive) this.fireAt(b); }));
      }
      this.shakeAmp = Math.max(this.shakeAmp, 0.35);
    }

    // ---------------- reset ----------------

    resetCity() {
      if (!this.city || this.switching) return;
      this.cancelAll();
      const city = this.city;
      this.aliensWon = false;
      gsap.to('#victory', { opacity: 0, duration: 0.35 });

      // restore instanced buildings + antennas + beacons
      const quat = new THREE.Quaternion();
      const pos = new THREE.Vector3();
      const scl = new THREE.Vector3();
      const m = new THREE.Matrix4();
      const mesh = city.buildings.mesh;
      city.buildings.list.forEach(b => {
        pos.set(b.x, b.h / 2, b.z);
        quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), b.rotation);
        scl.set(b.w, b.h, b.d);
        m.compose(pos, quat, scl);
        mesh.setMatrixAt(b.index, m);
        b.alive = true;
      });
      mesh.instanceMatrix.needsUpdate = true;
      city.aliveCount = city.total;
      if (city.antennas) {
        city.antennas.list.forEach(b => {
          pos.set(b.x, b.h / 2 + b.antennaLen / 2, b.z);
          quat.identity();
          scl.set(1, b.antennaLen, 1);
          m.compose(pos, quat, scl);
          city.antennas.mesh.setMatrixAt(b.antennaIndex, m);
        });
        city.antennas.mesh.instanceMatrix.needsUpdate = true;
      }
      if (city.beacons) {
        city.beacons.list.forEach((b, i) => {
          pos.set(b.x, b.beaconY, b.z);
          quat.identity();
          scl.setScalar(1);
          m.compose(pos, quat, scl);
          city.beacons.mesh.setMatrixAt(i, m);
        });
        city.beacons.mesh.instanceMatrix.needsUpdate = true;
      }

      // restore landmark from its stored pristine look
      const lm = city.landmark;
      lm.alive = true;
      lm.group.visible = true;
      lm.group.scale.set(1, 1, 1);
      lm.group.rotation.set(0, 0, 0);
      lm.group.traverse(o => {
        if (o.isPointLight) o.intensity = o.userData.origIntensity ?? 500;
      });
      const seen = new Set();
      lm.group.traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (seen.has(m) || !m.userData.orig) return;
            seen.add(m);
            if (m.emissive !== undefined) {
              m.emissive.copy(m.userData.orig.e);
              m.emissiveIntensity = m.userData.orig.ei;
            }
            if (m.color !== undefined) m.color.copy(m.userData.orig.c);
          });
        }
      });

      // clear rubble
      for (const r of city.rubble) {
        gsap.killTweensOf(r);
        sceneGroup.remove(r);
        r.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(mm => mm.dispose()); }
        });
      }
      city.rubble.length = 0;

      // clean FX + particles
      this.firePool.clear();
      this.smokePool.clear();
      this.fx.releaseAll();
      this.mothership.returnHome();
      this.hovered = null;
      this.updateIntegrity();
      this.scheduleAutoAttack();
      // celebration shockwave
      this.fx.spawn(new THREE.Vector3(0, 0.2, 0), 0x00e5ff, 1.8);
    }

    // ---------------- helpers ----------------

    track(t) {
      // NOTE: never touch a delayedCall's onComplete — gsap.delayedCall stores
      // the user callback *as* the tween's onComplete; replacing it would
      // neuter the attack pipeline. Finished tweens are pruned lazily instead.
      this.timers.add(t);
      return t;
    }

    pruneTimers() {
      if (this.timers.size === 0) return;
      for (const t of Array.from(this.timers)) {
        try {
          if (typeof t.progress === 'function' && t.progress() >= 1) this.timers.delete(t);
        } catch (e) {
          this.timers.delete(t);
        }
      }
    }

    cancelAll() {
      for (const t of this.timers) {
        try { t.kill(); } catch (e) { /* already finished */ }
      }
      this.timers.clear();
      if (this.autoTimer) { this.autoTimer.kill(); this.autoTimer = null; }
      gsap.killTweensOf(this.mothership.emitterMat);
      if (this.beams) {
        for (const b of this.beams.active.slice()) this.beams.release(b);
      }
      if (this.firePool) this.firePool.clear();
      if (this.smokePool) this.smokePool.clear();
      this.hovered = null;
      this.shakeAmp = 0;
    }

    // ---------------- per-frame ----------------

    update(dt) {
      this.time += dt;
      const t = this.time;

      // lazily forget finished tracked tweens (once per second)
      if (t - this.lastPrune > 1) {
        this.lastPrune = t;
        this.pruneTimers();
      }

      this.mothership.update(dt, t);
      this.scouts.update(dt, t);
      this.cars.update(dt);
      this.beams.update(t);
      this.fx.update(dt);
      this.firePool.update(dt);
      this.smokePool.update(dt);

      // beacon pulse
      if (this.city && this.city.beacons) {
        this.city.beacons.material.opacity = 0.6 + 0.4 * Math.sin(t * 2.4);
      }

      // anti-aircraft searchlights converge on the mothership
      for (const sl of searchlights) {
        updateSearchlight(sl, dt, t, this.mothership.group.position);
      }

      // camera shake
      if (this.shakeAmp > 0.001) {
        sceneGroup.position.set(
          (Math.random() - 0.5) * this.shakeAmp,
          (Math.random() - 0.5) * this.shakeAmp * 0.5,
          (Math.random() - 0.5) * this.shakeAmp
        );
        this.shakeAmp *= Math.exp(-dt * 5.2);
      } else {
        sceneGroup.position.set(0, 0, 0);
      }
    }

    /** Hover highlight + cursor. Runs once per frame while the pointer moves. */
    hover() {
      if (!this.city || this.switching) return;
      const hit = getHitBuilding(true);
      if (hit && hit !== this.hovered) {
        if (this.hovered) this.restoreHoverColor(this.hovered);
        this.hovered = hit;
        if (hit.kind !== 'landmark' && hit.alive) {
          this.city.buildings.mesh.setColorAt(hit.index, HOVER_COLOR);
          this.city.buildings.mesh.instanceColor.needsUpdate = true;
        }
      } else if (!hit && this.hovered) {
        this.restoreHoverColor(this.hovered);
        this.hovered = null;
      }
      renderer.domElement.style.cursor = hit ? 'crosshair' : 'grab';
    }

    restoreHoverColor(b) {
      if (b.kind === 'landmark' || !this.city) return;
      const orig = this.city.buildings.origColors;
      if (orig) {
        const c = this.city.buildings.mesh.instanceColor;
        c.setXYZ(b.index, orig[b.index * 3], orig[b.index * 3 + 1], orig[b.index * 3 + 2]);
        c.needsUpdate = true;
      }
    }
  }

  // ============================================================================
  //  GLOBAL WIRING — params, GUI, input, raycaster
  // ============================================================================

  const HOVER_COLOR = new THREE.Color(0xffaa66);

  const params = {
    city: 'New York',
    intensity: 5,
    fogDensity: CONFIG.fogDensity,
    laserColor: '#ff3b6e',
    particles: true,
    reset: () => game.resetCity(),
    armageddon: () => game.armageddon(),
  };

  // custom materials that implement FogExp2 manually
  const fogMaterials = new Set();
  function registerFogMaterial(mat) {
    fogMaterials.add(mat);
    mat.uniforms.uFogColor.value.copy(scene.fog.color);
    mat.uniforms.uFogDensity.value = scene.fog.density;
  }

  function setFogDensity(d) {
    scene.fog.density = d;
    for (const m of fogMaterials) {
      if (m.uniforms.uFogDensity) m.uniforms.uFogDensity.value = d;
    }
  }

  const game = new Game();
  game.start();

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let pointerDirty = false;

  function setPointerFromEvent(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  }

  /** Raycast the current city; `forHover` skips dead buildings. */
  function getHitBuilding(forHover = false) {
    if (!game.city) return null;
    raycaster.setFromCamera(pointer, camera);
    const city = game.city;

    const hits = raycaster.intersectObject(city.buildings.mesh, false);
    if (hits.length > 0) {
      const b = city.buildings.list[hits[0].instanceId];
      if (b && b.alive) return b;
      return null;
    }
    const lm = city.landmark;
    if (lm && lm.alive && lm.group.visible) {
      const lhits = raycaster.intersectObject(lm.group, true);
      if (lhits.length > 0) return lm;
    }
    return null;
  }

  renderer.domElement.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    setPointerFromEvent(e);
    const hit = getHitBuilding();
    if (hit) game.fireAt(hit);
  });

  renderer.domElement.addEventListener('pointermove', e => {
    setPointerFromEvent(e);
    pointerDirty = true;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    const pr = renderer.getPixelRatio();
    const h = window.innerHeight;
    starMat.uniforms.uPixelRatio.value = pr;
    starMat.uniforms.uHeight.value = h;
    game.firePool.points.material.uniforms.uPixelRatio.value = pr;
    game.firePool.points.material.uniforms.uHeight.value = h;
    game.smokePool.points.material.uniforms.uPixelRatio.value = pr;
    game.smokePool.points.material.uniforms.uHeight.value = h;
  });

  // ---------------- lil-gui control panel ----------------

  const gui = new GUI({ title: 'INVASION COMMAND' });
  gui.add(params, 'city', Object.keys(CITY_PROFILES)).name('City').onChange(v => game.switchCity(v));
  gui.add(params, 'intensity', 0, 10, 0.1).name('Invasion Intensity').onChange(() => game.scheduleAutoAttack());
  gui.add(params, 'fogDensity', 0.002, 0.012, 0.0001).name('Fog Density').onChange(setFogDensity);
  gui.add(params, 'laserColor', ['#ff3b6e', '#00e5ff', '#ff8800', '#a44dff']).name('Laser Color').onChange(c => game.beams.setColor(c));
  gui.add(params, 'particles').name('Particles').onChange(v => {
    game.firePool.setVisible(v);
    game.smokePool.setVisible(v);
  });
  const resetCtrl = gui.add(params, 'reset').name('Reset City');
  const doomCtrl = gui.add(params, 'armageddon').name('ARMAGEDDON');
  resetCtrl.domElement.classList.add('danger');
  doomCtrl.domElement.classList.add('danger');

  // ============================================================================
  //  MAIN LOOP
  // ============================================================================

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = game.time;

    // keep shared shader clocks alive
    if (game.city) {
      game.city.buildings.mesh.material.uniforms.uTime.value = t;
    }

    if (pointerDirty) {
      pointerDirty = false;
      game.hover();
    }

    game.update(dt);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // expose a tiny debug handle (handy for the console / tests)
  window.app = { game, params, scene, camera, renderer };

  console.log('%c👽 ALIEN INVASION — CITY DESTROYER', 'color:#9adfff;font-size:14px;font-weight:bold;');
  console.log('Click a building to target it. Orbit: drag. Zoom: scroll.');
  </script>
</body>
</html>
